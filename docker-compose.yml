# Local/evaluation stack: Next.js app + MongoDB + the e-GP scraper +
# background processing worker. Copy .env.example to .env first (at minimum
# set EGP_API_KEY; Vertex/GCS stay optional/disabled by default).
#
#   cp .env.example .env
#   docker compose up --build
#
# The app is then at http://localhost:3000. `scraper` runs once and exits;
# re-run it on demand with `docker compose run --rm scraper`. `worker` polls
# continuously for queued processing jobs.

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'try { rs.status(); } catch (e) { rs.initiate({_id: \"rs0\", members: [{_id: 0, host: \"mongo:27017\"}]}); } if (!db.hello().isWritablePrimary) quit(1);'"]
      interval: 5s
      timeout: 10s
      retries: 30
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      # Overrides .env's MONGODB_URI so the app talks to the compose-network
      # mongo service instead of whatever host/Atlas URI is configured there.
      MONGODB_URI: mongodb://mongo:27017/moneytamngan?replicaSet=rs0
    volumes:
      - tor-storage:/app/storage

  scraper:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: "no"
    depends_on:
      mongo:
        condition: service_healthy
    env_file:
      - .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/moneytamngan?replicaSet=rs0
      TOR_STORAGE_DIR: storage/tor
    command: ["node", "scripts/scrape.js"]
    volumes:
      - tor-storage:/app/storage

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    env_file:
      - .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/moneytamngan?replicaSet=rs0
      TOR_STORAGE_DIR: storage/tor
    command: ["node", "scripts/worker.js", "--watch"]
    volumes:
      - tor-storage:/app/storage

volumes:
  mongo-data:
  tor-storage:
