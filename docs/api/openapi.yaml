  # ---------------------------------------------------------------------------
  # Current - Bid preparation (FR-4.7). Live Next.js routes are /api + path
  # on port 3000. No operation submits a bid to e-GP.
  # ---------------------------------------------------------------------------
  /bid-prep/data:
    delete:
      summary: Delete the signed-in user's company bid data and drafts
      description: >
        Requires `profile:write`.
        Clears company fields and deletes every draft owned by the session.
        The account itself is not deleted. A follow-up read must show the
        company fields empty and the draft count at zero before this returns
        success. Requires JSON `{ "confirm": "DELETE_COMPANY_DATA" }`.
        The JSON body is limited to 4 KiB.
      operationId: deleteBidPrepCompanyData
      tags: [Bid preparation]
      security: [{ sessionAuth: [] }, { scopedJwtBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm:
                  type: string
                  enum: [DELETE_COMPANY_DATA]
      responses:
        "200":
          description: Company data and drafts were deleted and verified gone
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BidPrepDeletion"
        "400":
          description: "Malformed JSON, invalid root object or missing confirmation. Codes `INVALID_JSON`, `INVALID_BODY`, `CONFIRMATION_REQUIRED`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "Not logged in. Code `UNAUTHORIZED`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403": { $ref: '#/components/responses/Forbidden' }
        "404":
          description: "Current user no longer exists. Code `USER_NOT_FOUND`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "413":
          description: "JSON body exceeds 4 KiB. Code `PAYLOAD_TOO_LARGE`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "415":
          description: "Content-Type must be application/json. Code `UNSUPPORTED_MEDIA_TYPE`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "429": { $ref: '#/components/responses/RateLimited' }
        "500":
          description: "Bid preparation request failed. Codes `DELETE_INCOMPLETE`, `INTERNAL`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /bid-prep/drafts:
    get:
      summary: List the signed-in user's proposal drafts
      description: "Requires `profile:read`."
      operationId: listBidPrepDrafts
      tags: [Bid preparation]
      security: [{ sessionAuth: [] }, { scopedJwtBearer: [] }]
      responses:
        "200":
          description: Drafts owned by the caller
          content:
            application/json:
              schema:
                type: object
                required: [drafts, notices]
                properties:
                  drafts:
                    type: array
                    items:
                      $ref: "#/components/schemas/BidPrepDraftSummary"
                  notices:
                    $ref: "#/components/schemas/BidPrepNotices"
        "401":
          description: "Not logged in. Code `UNAUTHORIZED`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403": { $ref: '#/components/responses/Forbidden' }
        "429": { $ref: '#/components/responses/RateLimited' }
        "500":
          description: "Bid preparation request failed. Code `INTERNAL`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      summary: Create a proposal draft for the signed-in user
      description: >
        Requires `profile:write`.
        The owner is the session subject. A user id in the body is ignored.
        Creation is limited per user (default 5 per hour) and returns 429
        with Retry-After. The JSON body is limited to 128 KiB. Audit entries omit draft text.
      operationId: createBidPrepDraft
      tags: [Bid preparation]
      security: [{ sessionAuth: [] }, { scopedJwtBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BidPrepDraftInput"
            example:
              projectId: "69110000001"
              title: Permit Portal Technical Proposal
              sections:
                - heading: Scope of work
                  body: Develop a portal for online permit applications.
                  sources: [TOR scope of work]
      responses:
        "201":
          description: Draft created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BidPrepDraft"
              example:
                id: 6550f1b2d4e6a7c809123458
                projectId: "69110000001"
                title: Permit Portal Technical Proposal
                version: 1
                createdAt: "2026-11-21T08:10:00.000Z"
                updatedAt: "2026-11-21T08:10:00.000Z"
                sections:
                  - heading: Scope of work
                    body: Develop a portal for online permit applications.
                    sources: [TOR scope of work]
