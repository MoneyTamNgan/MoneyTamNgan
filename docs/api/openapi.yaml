openapi: 3.0.3
info:
  title: MoneyTamNgan API
  description: >
    JSON REST API contract between the Next.js frontend and the Node.js backend,
    covering the full system so FE/BE only need to design this once.

    Endpoints are tagged by status (see each tag's description). "Current"
    endpoints are the committed, build-now target (TOR ingestion + software/
    non-software classification, FR-1.1/FR-1.2); everything else is a
    forward-looking draft that MAY change once its requirements are worked
    out in detail — treat it as a starting point for later contract review,
    not a frozen spec.
  version: "0.2.0-draft"
servers:
  - url: http://localhost:4000/api/v1
    description: Local development (backend port TBD by BE dev)

security: []

tags:
  - name: TORs
    description: "[Current] Public/shared endpoints for reading ingested TOR records (FR-1.1, FR-1.2)."
  - name: Admin - Ingestion
    description: "[Current] Monitoring and manual triggering of scraping jobs (FR-1.1)."
  - name: Admin - Classification
    description: "[Current] Reviewing and correcting software/non-software classification (FR-1.2)."
  - name: Auth
    description: "[Planned] Login/session, required by Contractor Profile and Matching below (supports FR-2.2/2.3)."
  - name: Contractor Profile
    description: "[Planned] Self-reported contractor profile CRUD (FR-2.2)."
  - name: Matching
    description: "[Planned] Match scoring between TORs and contractor profiles (FR-2.3)."
  - name: PDF Summary
    description: "[Planned] OCR/LLM-extracted structured summary fields on a TOR (FR-2.1)."
  - name: Anomaly Detection
    description: "[Planned] Budget and qualification anomaly flags on a TOR (FR-3.1, FR-3.2)."
  - name: Public Analytics
    description: "[Planned] Unauthenticated historical search and aggregate metrics (FR-4.1, FR-4.2)."

paths:
  # ---------------------------------------------------------------------------
  # Current - build now
  # ---------------------------------------------------------------------------
  /health:
    get:
      summary: Liveness check
      description: Basic health check for FE integration smoke-testing.
      operationId: getHealth
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok

  /tors:
    get:
      summary: List/filter ingested TORs
      tags: [TORs]
      operationId: listTors
      parameters:
        - name: isSoftware
          in: query
          description: Filter by classification result. Omit to include all (including pending/null).
          schema:
            type: boolean
        - name: agency
          in: query
          description: Filter by exact issuing agency name.
          schema:
            type: string
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/TorStatus"
        - name: dateFrom
          in: query
          description: Inclusive lower bound on releaseDate (ISO 8601 date).
          schema:
            type: string
            format: date
        - name: dateTo
          in: query
          description: Inclusive upper bound on releaseDate (ISO 8601 date).
          schema:
            type: string
            format: date
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
      responses:
        "200":
          description: Paginated list of TORs
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedList"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/Tor"
              example:
                items:
                  - id: "TOR-2569-014"
                    title: "ระบบบริหารจัดการจราจรอัจฉริยะ"
                    agency: "สำนักการจราจรและขนส่ง"
                    budget: 15000000
                    releaseDate: "2026-08-09"
                    sourceUrl: "https://procurement.bangkok.go.th/tor/2569-014"
                    pdfUrl: "https://procurement.bangkok.go.th/tor/2569-014.pdf"
                    status: "Active"
                    isSoftware: true
                    classificationConfidence: 0.92
                    createdAt: "2026-08-09T08:15:00Z"
                    updatedAt: "2026-08-09T08:15:00Z"
                total: 186
                page: 1
                pageSize: 20
        "400":
          description: Invalid filter parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /tors/{id}:
    get:
      summary: Get a single TOR by id
      tags: [TORs]
      operationId: getTor
      parameters:
        - $ref: "#/components/parameters/TorIdParam"
      responses:
        "200":
          description: TOR detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tor"
        "404":
          description: TOR not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /admin/ingestion/runs:
    get:
      summary: List recent ingestion job runs
      description: Backs the admin "ingestion overview" panel (source, status, item counts).
      tags: [Admin - Ingestion]
      operationId: listIngestionRuns
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
      responses:
        "200":
          description: Paginated list of ingestion runs, most recent first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedList"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/IngestionRun"
    post:
      summary: Manually trigger an ingestion job
      description: >
        Backs the "สั่งการดึงข้อมูลด้วยตนเอง" (trigger ingestion manually) button
        in the admin mockup.
      tags: [Admin - Ingestion]
      operationId: triggerIngestionRun
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                source:
                  type: string
                  description: Optional single source to run (e.g. "BMA Procurement Portal", "e-GP"). Omit to run all configured sources.
      responses:
        "202":
          description: Ingestion job accepted and started asynchronously
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestionRun"
        "409":
          description: An ingestion run is already in progress for the requested source
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /admin/classification/queue:
    get:
      summary: List TORs pending or uncertain classification review
      description: Backs the "ตรวจสอบประเภท TOR" (review TOR category) panel.
      tags: [Admin - Classification]
      operationId: listClassificationQueue
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
      responses:
        "200":
          description: Paginated list of TORs needing manual classification review
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedList"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/Tor"

  /admin/tors/{id}/classification:
    patch:
      summary: Manually confirm or override a TOR's classification
      tags: [Admin - Classification]
      operationId: updateTorClassification
      parameters:
        - $ref: "#/components/parameters/TorIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [isSoftware]
              properties:
                isSoftware:
                  type: boolean
      responses:
        "200":
          description: Updated TOR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tor"
        "404":
          description: TOR not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /admin/keywords:
    get:
      summary: List classification keyword rules
      tags: [Admin - Classification]
      operationId: listClassificationKeywords
      responses:
        "200":
          description: All keyword rules used by the classifier
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClassificationKeyword"
    put:
      summary: Replace the classification keyword list
      description: Backs the admin toggle for updating software-classification keywords.
      tags: [Admin - Classification]
      operationId: replaceClassificationKeywords
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                required: [keyword, category]
                properties:
                  keyword:
                    type: string
                  category:
                    $ref: "#/components/schemas/KeywordCategory"
      responses:
        "200":
          description: Updated keyword list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClassificationKeyword"
        "400":
          description: Invalid keyword list (e.g. empty keyword string)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ---------------------------------------------------------------------------
  # Planned - PDF parsing / summarization (FR-2.1)
  # ---------------------------------------------------------------------------
  /tors/{id}/summary:
    get:
      summary: Get the LLM-extracted structured summary for a TOR
      description: >
        Planned. Populated once the OCR + Vertex AI extraction pipeline has
        processed the source PDF; 404 until then (or return the Tor's summary
        fields as null - to be settled with BE once this is built).
      tags: [PDF Summary]
      operationId: getTorSummary
      parameters:
        - $ref: "#/components/parameters/TorIdParam"
      responses:
        "200":
          description: Structured summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TorSummary"
        "404":
          description: TOR not found, or summary not yet generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ---------------------------------------------------------------------------
  # Planned - Auth (supports FR-2.2, FR-2.3)
  # ---------------------------------------------------------------------------
  /auth/google:
    post:
      summary: Log in with a Google ID token
      description: Planned, matches the mockup's "เข้าสู่ระบบด้วย Google" button.
      tags: [Auth]
      operationId: loginWithGoogle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idToken]
              properties:
                idToken:
                  type: string
                  description: Google Sign-In ID token from the frontend.
      responses:
        "200":
          description: Session established (sets sessionAuth cookie)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Invalid Google token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/login:
    post:
      summary: Log in with email + password
      tags: [Auth]
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        "200":
          description: Session established (sets sessionAuth cookie)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/logout:
    post:
      summary: End the current session
      tags: [Auth]
      operationId: logout
      security: [{ sessionAuth: [] }]
      responses:
        "204":
          description: Logged out

  /auth/me:
    get:
      summary: Get the currently logged-in user
      tags: [Auth]
      operationId: getCurrentUser
      security: [{ sessionAuth: [] }]
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ---------------------------------------------------------------------------
  # Planned - Contractor Profile (FR-2.2)
  # ---------------------------------------------------------------------------
  /profile:
    get:
      summary: Get the current user's contractor profile
      tags: [Contractor Profile]
      operationId: getProfile
      security: [{ sessionAuth: [] }]
      responses:
        "200":
          description: Contractor profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractorProfile"
        "404":
          description: Profile not created yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: Create the current user's contractor profile
      tags: [Contractor Profile]
      operationId: createProfile
      security: [{ sessionAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContractorProfileInput"
      responses:
        "201":
          description: Profile created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractorProfile"
    put:
      summary: Update the current user's contractor profile
      description: Per FR-2.2.3 - users may update their profile at any time.
      tags: [Contractor Profile]
      operationId: updateProfile
      security: [{ sessionAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContractorProfileInput"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractorProfile"

  # ---------------------------------------------------------------------------
  # Planned - Matching (FR-2.3)
  # ---------------------------------------------------------------------------
  /matches:
    get:
      summary: List TORs matching the current user's profile above their threshold
      tags: [Matching]
      operationId: listMatches
      security: [{ sessionAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
      responses:
        "200":
          description: Paginated list of matched TORs
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedList"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/MatchResult"

  /tors/{id}/match:
    get:
      summary: Get the match score between one TOR and the current user's profile
      tags: [Matching]
      operationId: getTorMatch
      security: [{ sessionAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/TorIdParam"
      responses:
        "200":
          description: Match result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchResult"
        "404":
          description: TOR not found, or no profile exists to match against
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ---------------------------------------------------------------------------
  # Planned - Anomaly Detection (FR-3.1, FR-3.2)
  # ---------------------------------------------------------------------------
  /tors/{id}/anomalies:
    get:
      summary: Get budget and qualification anomaly flags for a TOR
      description: Backs the clause-level highlight UI and budget warning badge.
      tags: [Anomaly Detection]
      operationId: getTorAnomalies
      parameters:
        - $ref: "#/components/parameters/TorIdParam"
      responses:
        "200":
          description: Anomaly detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnomalyReport"
        "404":
          description: TOR not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /tors/{id}/report:
    post:
      summary: User-submitted flag report on a TOR
      description: Backs the "user flag reporting button" component.
      tags: [Anomaly Detection]
      operationId: reportTor
      parameters:
        - $ref: "#/components/parameters/TorIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
      responses:
        "201":
          description: Report submitted
        "404":
          description: TOR not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ---------------------------------------------------------------------------
  # Planned - Public Analytics (FR-4.1, FR-4.2)
  # ---------------------------------------------------------------------------
  /analytics/search:
    get:
      summary: Search historical TOR records with aggregate metrics
      tags: [Public Analytics]
      operationId: searchAnalytics
      description: >
        Unauthenticated, rate-limited per NFR-4/FR-4.2.2 (see 429 response).
      parameters:
        - name: dateFrom
          in: query
          schema:
            type: string
            format: date
        - name: dateTo
          in: query
          schema:
            type: string
            format: date
        - name: agency
          in: query
          schema:
            type: string
        - name: budgetMin
          in: query
          schema:
            type: number
        - name: budgetMax
          in: query
          schema:
            type: number
        - name: category
          in: query
          schema:
            type: string
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
      responses:
        "200":
          description: Search results with aggregate metrics
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedList"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/Tor"
                      aggregates:
                        $ref: "#/components/schemas/AnalyticsAggregates"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /analytics/export:
    get:
      summary: Export historical search results as CSV or JSON
      tags: [Public Analytics]
      operationId: exportAnalytics
      parameters:
        - name: format
          in: query
          required: true
          schema:
            type: string
            enum: [csv, json]
        - name: dateFrom
          in: query
          schema:
            type: string
            format: date
        - name: dateTo
          in: query
          schema:
            type: string
            format: date
        - name: agency
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
      responses:
        "200":
          description: File contents
          content:
            text/csv:
              schema:
                type: string
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tor"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: mtn_session
      description: >
        Planned. Session cookie set after successful login via /auth/google
        or /auth/login. Admin-only endpoints (all /admin/* paths) will also
        require this once auth lands; they're unauthenticated for now since
        no login flow exists yet.

  parameters:
    TorIdParam:
      name: id
      in: path
      required: true
      schema:
        type: string
      example: "TOR-2569-014"
    PageParam:
      name: page
      in: query
      description: 1-indexed page number. Defaults to 1.
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSizeParam:
      name: pageSize
      in: query
      description: Items per page. Defaults to 20, max 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  schemas:
    TorStatus:
      type: string
      enum: [Active, Superseded, Invalid, Cancelled]

    KeywordCategory:
      type: string
      enum: [software, non-software]

    Tor:
      type: object
      required:
        - id
        - title
        - agency
        - budget
        - releaseDate
        - sourceUrl
        - status
        - isSoftware
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          description: Unique project id or URL-hash-derived identifier (FR-1.1.3 dedup key).
        title:
          type: string
        agency:
          type: string
          description: Issuing BMA agency name.
        budget:
          type: number
          description: Announced budget in THB.
        releaseDate:
          type: string
          format: date
        sourceUrl:
          type: string
          format: uri
        pdfUrl:
          type: string
          format: uri
          nullable: true
        status:
          $ref: "#/components/schemas/TorStatus"
        isSoftware:
          type: boolean
          nullable: true
          description: null = not yet classified.
        classificationConfidence:
          type: number
          nullable: true
          minimum: 0
          maximum: 1
          description: Classifier confidence score, null if not yet classified or manually overridden.
        supersededByTorId:
          type: string
          nullable: true
          description: "[Planned, FR-1.3] Id of the newer revision, if this record's status is Superseded."
        matchScore:
          type: number
          nullable: true
          minimum: 0
          maximum: 100
          description: "[Planned] Populated only when returned via an authenticated endpoint for a contractor with a profile."
        budgetAnomaly:
          type: object
          nullable: true
          description: "[Planned]"
          allOf:
            - $ref: "#/components/schemas/BudgetAnomaly"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TorSummary:
      type: object
      description: "[Planned, FR-2.1]"
      properties:
        torId:
          type: string
        executiveSummary:
          type: string
        vendorEligibility:
          type: string
        requiredTeamExperience:
          type: string
        requiredTechStack:
          type: array
          items:
            type: string
        requiredCertifications:
          type: array
          items:
            type: string
        generatedAt:
          type: string
          format: date-time

    IngestionRun:
      type: object
      required: [id, source, startedAt, status, itemsFound, itemsNew, itemsFailed]
      properties:
        id:
          type: string
        source:
          type: string
          description: e.g. "BMA Procurement Portal", "e-GP".
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum: [running, success, failed]
        itemsFound:
          type: integer
        itemsNew:
          type: integer
        itemsFailed:
          type: integer

    ClassificationKeyword:
      type: object
      required: [id, keyword, category, updatedAt]
      properties:
        id:
          type: string
        keyword:
          type: string
        category:
          $ref: "#/components/schemas/KeywordCategory"
        updatedBy:
          type: string
          nullable: true
        updatedAt:
          type: string
          format: date-time

    User:
      type: object
      description: "[Planned]"
      required: [id, email, role]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
          nullable: true
        role:
          type: string
          enum: [contractor, admin]

    ContractorProfileInput:
      type: object
      description: "[Planned] FR-2.2.2 - self-reported, no verification required."
      properties:
        companyName:
          type: string
        techStack:
          type: array
          items:
            type: string
        projectCapacity:
          type: string
          description: Free-text self-reported capacity (e.g. team size, concurrent-project count).
        pastProjectValues:
          type: array
          items:
            type: number
          description: THB values of past completed projects, self-reported.
        certifications:
          type: array
          items:
            type: string
        capital:
          type: number
          nullable: true
        matchThreshold:
          type: number
          minimum: 0
          maximum: 100
          default: 70
          description: FR-2.3.3 - notification fires when a TOR's matchScore meets/exceeds this.

    ContractorProfile:
      allOf:
        - $ref: "#/components/schemas/ContractorProfileInput"
        - type: object
          required: [id, userId, createdAt, updatedAt]
          properties:
            id:
              type: string
            userId:
              type: string
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time

    MatchResult:
      type: object
      description: "[Planned, FR-2.3.2]"
      required: [torId, matchScore, computedAt]
      properties:
        torId:
          type: string
        matchScore:
          type: number
          minimum: 0
          maximum: 100
        skillOverlapScore:
          type: number
          nullable: true
        contractSizeScore:
          type: number
          nullable: true
        teamCapacityScore:
          type: number
          nullable: true
        computedAt:
          type: string
          format: date-time

    BudgetAnomalyTag:
      type: string
      enum: [NONE, HIGH_BUDGET_ANOMALY]

    BudgetAnomaly:
      type: object
      description: "[Planned, FR-3.1]"
      properties:
        baselinePrice:
          type: number
          description: Category Average(Scope Category), or the TOR's own budget if no historical category data exists yet.
        deviationMultiplier:
          type: number
          description: TOR Budget / Baseline Price.
        tag:
          $ref: "#/components/schemas/BudgetAnomalyTag"

    FlaggedClause:
      type: object
      description: "[Planned, FR-3.2]"
      required: [clauseText, type, reasoning]
      properties:
        clauseText:
          type: string
        type:
          type: string
          enum: [IRRELEVANT_HARDWARE, UNREALISTIC_TENURE, VENDOR_LOCK_IN, OTHER]
        reasoning:
          type: string
          description: Stored LLM/rule-based reasoning behind the flag (FR-3.2.3).

    AnomalyReport:
      type: object
      description: "[Planned]"
      properties:
        torId:
          type: string
        budgetAnomaly:
          $ref: "#/components/schemas/BudgetAnomaly"
        flaggedClauses:
          type: array
          items:
            $ref: "#/components/schemas/FlaggedClause"

    AnalyticsAggregates:
      type: object
      description: "[Planned, FR-4.1.3]"
      properties:
        meanBudget:
          type: number
        medianDuration:
          type: number
          description: In days.
        totalSpend:
          type: number

    PaginatedList:
      type: object
      required: [total, page, pageSize]
      properties:
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: "TOR_NOT_FOUND"
            message:
              type: string
              example: "No TOR exists with the given id."

