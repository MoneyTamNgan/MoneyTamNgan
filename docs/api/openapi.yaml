  /bid-prep/drafts/{id}/export:
    post:
      summary: Download the caller's draft and checklist as one DOCX
      description: >
        Requires `profile:write`.
        One plain-text DOCX contains the saved proposal sections and sources plus
        the current caller-specific checklist (status, reason and TOR page).
        Export requires an available, non-empty, untruncated checklist with every
        item marked as passed.
        The file states it is an AI draft, does not submit to e-GP, and shows created,
        modified and exported dates. A4 fixed-width tables and Thai-capable fonts
        are used. Maximum size is 2 MiB. PDF is outside this release (#145).
        Another user's draft returns 404. Each successful export audits only user,
        time, IP and draft/project identifiers. Raw HTML, fields and macros are absent.
      operationId: exportBidPrepDraft
      tags: [Bid preparation]
      security: [{ sessionAuth: [] }, { scopedJwtBearer: [] }]
      parameters:
        - $ref: "#/components/parameters/BidPrepDraftIdParam"
        - name: version
          in: query
          description: Optional saved draft version. A stale version returns 409; the editor supplies it.
          schema: { type: integer, minimum: 1, maximum: 9007199254740991 }
      responses:
        "200":
          description: DOCX file
          headers:
            Content-Disposition:
              description: Attachment filename for the exported draft.
              schema: { type: string }
          content:
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema:
                type: string
                format: binary
        "400":
          description: "Draft is empty, corrupt, or version is invalid. Codes `EMPTY_DRAFT`, `INVALID_DRAFT`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "Not logged in. Code `UNAUTHORIZED`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403": { $ref: '#/components/responses/Forbidden' }
        "404":
          description: "Missing draft, or a draft owned by someone else. Code `DRAFT_NOT_FOUND`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "The saved draft version changed, or the checklist is incomplete or has items that have yet to pass. Codes `DRAFT_CONFLICT`, `CHECKLIST_NOT_PASSED`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error:
                  code: CHECKLIST_NOT_PASSED
                  message: A complete checklist with every item marked as passed is required before export.
        "413":
          description: "Export exceeds 2 MiB. Code `PAYLOAD_TOO_LARGE`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: '#/components/responses/RateLimited' }
        "500":
          description: "Bid preparation request failed. Code `INTERNAL`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /bid-prep/tors/{projectId}/checklist:
    get:
      summary: Checklist for one TOR using the signed-in user's profile
      description: >
        Requires `profile:read`.
        The checklist can automatically check a verified past-project minimum
        as a separate value-only item. Items include any status overrides saved by the caller.
        A user id in the query is ignored. Missing or unprocessed TORs return 404 or 409.
      operationId: getBidPrepChecklist
      tags: [Bid preparation]
      security: [{ sessionAuth: [] }, { scopedJwtBearer: [] }]
      parameters:
        - $ref: "#/components/parameters/BidPrepProjectIdParam"
      responses:
        "200":
          description: Checklist for the caller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BidPrepChecklist"
              example:
                projectId: "69110000001"
                notices:
                  aiDraft: This is an AI draft. Check every statement and its source before submitting.
                  noEgpSubmission: MoneyTamNgan does not submit a bid to e-GP. The seller must review this draft and submit it with their own digital signature.
                  noEgpSubmissionTh: ระบบนี้ไม่ยื่นซองต่อ e-GP ให้ผู้ใช้ ผู้ขายต้องตรวจสอบเอกสารแล้วไปยื่นด้วยลายมือชื่อดิจิทัลของตนเอง
                summary: { pass: 0, fail: 0, manual: 1 }
                missingProfileFields: [registered_capital, concurrent_project_capacity, certifications]
                pastProjectValueComparison:
                  status: not_stated
                  companyValueBaht: 1500000
                  minimumBaht: null
                  operator: null
                  meetsMinimum: null
                  evidence: []
                truncated: false
                items:
                  - id: "e46a3f462a579a399e23278caa4399e01fa0724df033372775e0246824b80a3a"
                    requirement: Provide proof of company registration.
                    status: manual
                    overrideStatus: null
                    reason: Check the full qualification against the company profile and the TOR.
                    evidencePages: [3]
                    needsReview: false
        "401":
          description: "Not logged in. Code `UNAUTHORIZED`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403": { $ref: '#/components/responses/Forbidden' }
        "404":
          description: "TOR or current user not found. Codes `TOR_NOT_FOUND`, `USER_NOT_FOUND`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "TOR is unprocessed or its current document is unreadable. Codes `TOR_NOT_READY`, `TOR_DOCUMENT_UNREADABLE`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429": { $ref: '#/components/responses/RateLimited' }
        "500":
          description: "Bid preparation request failed. Code `INTERNAL`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    patch:
      summary: Set or clear the caller's checklist item status override
      description: "Requires `profile:write`. The JSON body is limited to 1 KiB. Use an item ID from the caller's current checklist."
      operationId: updateBidPrepChecklistStatus
      tags: [Bid preparation]
      security: [{ sessionAuth: [] }, { scopedJwtBearer: [] }]
      parameters:
        - $ref: "#/components/parameters/BidPrepProjectIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [itemId, status]
              properties:
                itemId: { type: string, pattern: "^[a-f0-9]{64}$" }
                status:
                  type: string
                  nullable: true
                  enum: [pass, fail, manual, null]
                  description: Use null to restore the automatic status.
            example:
              itemId: "e46a3f462a579a399e23278caa4399e01fa0724df033372775e0246824b80a3a"
              status: pass
      responses:
        "200":
          description: Updated checklist for the caller
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BidPrepChecklist" }
        "400":
          description: "Malformed JSON, invalid root object, checklist item ID or status. Codes `INVALID_JSON`, `INVALID_BODY`, `INVALID_CHECKLIST_STATUS`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: "Not logged in. Code `UNAUTHORIZED`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: "Request origin or scope is not allowed. Codes `INSUFFICIENT_SCOPE`, `FORBIDDEN_ORIGIN`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: "TOR, checklist item or current user not found. Codes `TOR_NOT_FOUND`, `USER_NOT_FOUND`, `CHECKLIST_ITEM_NOT_FOUND`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: "TOR is unprocessed, its current document is unreadable, or the caller's BidPrep data changed. Codes `TOR_NOT_READY`, `TOR_DOCUMENT_UNREADABLE`, `CHECKLIST_CHANGED`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413":
          description: "Request body is too large. Code `PAYLOAD_TOO_LARGE`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "415":
          description: "Request body must be JSON. Code `UNSUPPORTED_MEDIA_TYPE`."
