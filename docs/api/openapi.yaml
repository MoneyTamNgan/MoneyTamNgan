            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "403":
          description: "Missing pipeline:read scope. Codes `INSUFFICIENT_SCOPE`, `FORBIDDEN_ORIGIN`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "500":
          description: "Ingestion status check failed. Code `STATUS_CHECK_FAILED`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PipelineFailure' }

  /ingestion/trigger:
    post:
      summary: Manually trigger e-GP ingestion
      description: "Requires `pipeline:trigger`."
      tags: [Pipeline]
      operationId: triggerIngestion
      security: [{ sessionAuth: [] }, { scopedJwtBearer: [] }, { pipelineBearer: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                year: { $ref: '#/components/schemas/FourDigitCode' }
                keyword: { type: string }
                limit: { type: integer, minimum: 1, maximum: 1000 }
                deptCode: { type: string }
                rssDeptId: { $ref: '#/components/schemas/FourDigitCode' }
                enqueueProcessing: { type: boolean, default: true }
                verifyInline: { type: boolean, default: false }
      responses:
        "202":
          description: "e-GP ingestion completed and ingestion counts returned"
          content:
            application/json:
              schema:
                type: object
                required: [status, source, params, itemsFound, itemsNew, itemsUpdated, itemsFailed, jobsQueued, candidatesSaved, skipped, skipExamples, revisionsLinked, revisionsSuperseded, errors, completedAt]
                properties:
                  status: { type: string, enum: [completed] }
                  source: { type: string, enum: [EGP-CONTRACT] }
                  params:
                    type: object
                    required: [year, keyword, deptCode]
                    properties:
                      year: { $ref: '#/components/schemas/FourDigitCode' }
                      keyword: { type: string, nullable: true }
                      deptCode: { type: string, nullable: true }
                  itemsFound: { type: integer }
                  itemsNew: { type: integer }
                  itemsUpdated: { type: integer }
                  itemsFailed: { type: integer }
                  jobsQueued: { type: integer }
                  candidatesSaved: { type: integer }
                  skipped: { type: object, additionalProperties: { type: integer } }
                  skipExamples: { type: array, items: { type: object, additionalProperties: true } }
                  revisionsLinked: { type: integer, nullable: true }
                  revisionsSuperseded: { type: integer, nullable: true }
                  errors: { type: array, items: { type: object, additionalProperties: true } }
                  completedAt: { type: string, format: date-time }
        "400":
          description: "Invalid ingestion parameters. Code `INVALID_INGESTION_REQUEST`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PipelineFailure' }
        "401":
          description: "Authentication required. Code `UNAUTHORIZED`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "403":
          description: "Missing pipeline:trigger scope or forbidden Origin. Codes `INSUFFICIENT_SCOPE`, `FORBIDDEN_ORIGIN`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "500":
          description: "Ingestion failed or e-GP blocked/rejected access. Codes `INGESTION_FAILED`, `EGP_UPSTREAM_BLOCKED`, `EGP_AUTH_FAILED`."
          content:
            application/json:
              schema:
                type: object
                required: [status, error]
                properties:
                  status: { type: string, enum: [failed] }
                  error:
                    type: object
                    required: [code, message, retryable]
                    properties:
                      code: { type: string }
                      message: { type: string }
                      retryable: { type: boolean }
        "503":
          description: "Retryable e-GP failure. Code `INGESTION_UPSTREAM_UNAVAILABLE`."
          content:
            application/json:
              schema:
                type: object
                required: [status, error]
                properties:
                  status: { type: string, enum: [failed] }
                  error:
                    type: object
                    required: [code, message, retryable]
                    properties:
                      code: { type: string }
                      message: { type: string }
                      retryable: { type: boolean }

