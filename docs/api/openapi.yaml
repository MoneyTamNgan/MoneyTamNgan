  # ---------------------------------------------------------------------------
  # Public Analytics (FR-4.1, FR-4.2)
  # ---------------------------------------------------------------------------
  /analytics/overview:
    get:
      summary: Search and aggregate the live TOR analytics catalog
      tags: [Public Analytics]
      operationId: analyticsOverview
      description: >
        Returns de-duplicated projects, dashboard metrics, chart series, and
        complete filter facets for projects with tender metadata. Bidding availability
        uses the exact submission deadline; fiscal years prefer confirmed document extraction.
        Ambiguous document years are excluded from year grouping, and missing years
        use a labeled estimate from the deadline in Asia/Bangkok.
      parameters:
        - name: isSoftware
          in: query
          schema: { type: boolean }
        - name: dateFrom
          in: query
          schema:
            oneOf:
              - { type: string, format: date }
              - { type: string, format: date-time }
        - name: dateTo
          in: query
          schema:
            oneOf:
              - { type: string, format: date }
              - { type: string, format: date-time }
        - name: agency
          in: query
          schema:
            type: string
        - name: budgetMin
          in: query
          schema:
            type: number
        - name: budgetMax
          in: query
          schema:
            type: number
        - name: biddingStatus
          in: query
          schema:
            type: string
            enum: [open, closed, cancelled, unknown]
        - name: fiscalYear
          in: query
          description: Thai Buddhist Era fiscal year, confirmed extraction first, otherwise estimated from the bidding deadline.
          schema: { type: integer, minimum: 2400, maximum: 3000 }
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/AnalyticsLimitParam"
        - $ref: "#/components/parameters/AnalyticsPageSizeAliasParam"
      responses:
        "200":
          description: Search results with aggregate metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsSearchResponse"
        "400":
          description: "Invalid filter parameters. Codes `INVALID_DATE_FROM`, `INVALID_DATE_TO`, `INVALID_DATE_RANGE`, `INVALID_BUDGET_MIN`, `INVALID_BUDGET_MAX`, `INVALID_BUDGET_RANGE`, `INVALID_PAGE`, `INVALID_LIMIT`, `INVALID_IS_SOFTWARE`, `INVALID_BIDDING_STATUS`, `INVALID_FISCAL_YEAR`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "429": { $ref: '#/components/responses/RateLimited' }
        "500":
          description: "Analytics operation failed. Code `ANALYTICS_SEARCH_FAILED`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /analytics/overview/export:
    get:
      summary: Export historical search results as CSV or JSON
      tags: [Public Analytics]
      operationId: exportAnalyticsOverview
      description: >
        Applies the same filters as GET /analytics/overview. Pagination parameters
        are validated but do not limit the export. Exports at most 10,000 records;
        X-Export-Truncated indicates additional matches.
      parameters:
        - name: format
          in: query
          required: true
          schema:
            type: string
            enum: [csv, json]
        - name: dateFrom
          in: query
          schema:
            oneOf:
              - { type: string, format: date }
              - { type: string, format: date-time }
        - name: dateTo
          in: query
          schema:
            oneOf:
              - { type: string, format: date }
              - { type: string, format: date-time }
        - name: agency
          in: query
          schema:
            type: string
        - name: isSoftware
          in: query
          schema: { type: boolean }
        - name: biddingStatus
          in: query
          schema: { type: string, enum: [open, closed, cancelled, unknown] }
        - name: fiscalYear
          in: query
          schema: { type: integer, minimum: 2400, maximum: 3000 }
        - name: budgetMin
          in: query
          schema: { type: number, minimum: 0 }
        - name: budgetMax
          in: query
          schema: { type: number, minimum: 0 }
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/AnalyticsLimitParam"
        - $ref: "#/components/parameters/AnalyticsPageSizeAliasParam"
      responses:
        "200":
          description: File contents
          headers:
            X-Export-Truncated:
              description: Whether additional records matched the filters.
              schema: { type: string, enum: ["true", "false"] }
            Content-Disposition:
              description: Attachment filename for the requested format.
              schema: { type: string }
          content:
            text/csv:
              schema:
                type: string
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AnalyticsTorItem"
        "400":
          description: "Invalid export format or filter. Codes `INVALID_DATE_FROM`, `INVALID_DATE_TO`, `INVALID_DATE_RANGE`, `INVALID_BUDGET_MIN`, `INVALID_BUDGET_MAX`, `INVALID_BUDGET_RANGE`, `INVALID_PAGE`, `INVALID_LIMIT`, `INVALID_IS_SOFTWARE`, `INVALID_BIDDING_STATUS`, `INVALID_FISCAL_YEAR`, `INVALID_FORMAT`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "429": { $ref: '#/components/responses/RateLimited' }
        "500":
          description: "Analytics operation failed. Code `ANALYTICS_EXPORT_FAILED`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /analytics/search:
    get:
      summary: Search historical TOR records with aggregate spend metrics
      tags: [Public Analytics]
      operationId: searchAnalytics
      description: >
        Public and rate-limited (FR-4.2.2, see 429). Aggregates cover every matching
        project. Use category to filter by classification and pageSize to set the page size.
      parameters:
        - name: dateFrom
          in: query
          description: Inclusive lower bound on announce date.
          schema:
            oneOf:
              - { type: string, format: date }
              - { type: string, format: date-time }
        - name: dateTo
          in: query
          description: Inclusive upper bound on announce date.
          schema:
            oneOf:
              - { type: string, format: date }
              - { type: string, format: date-time }
        - name: agency
          in: query
          description: Exact issuing agency name.
          schema: { type: string }
        - name: budgetMin
          in: query
          schema: { type: number, minimum: 0 }
        - name: budgetMax
          in: query
          schema: { type: number, minimum: 0 }
        - name: category
          in: query
          schema:
            $ref: "#/components/schemas/KeywordCategory"
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
      responses:
        "200":
          description: One page of matching TORs with aggregate metrics
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedList"
                  - type: object
                    required: [items, aggregates]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/TorListItem"
                      aggregates:
                        $ref: "#/components/schemas/AnalyticsAggregates"
        "400":
          description: "Invalid filter parameters. Codes `INVALID_DATE_FROM`, `INVALID_DATE_TO`, `INVALID_DATE_RANGE`, `INVALID_BUDGET_MIN`, `INVALID_BUDGET_MAX`, `INVALID_BUDGET_RANGE`, `INVALID_CATEGORY`, `INVALID_PAGE`, `INVALID_PAGE_SIZE`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "429": { $ref: '#/components/responses/RateLimited' }
        "500":
          description: "Analytics operation failed. Code `ANALYTICS_SEARCH_FAILED`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /analytics/export:
    get:
      summary: Export matching TOR records as CSV or JSON
      tags: [Public Analytics]
      operationId: exportAnalytics
      description: >
        Unauthenticated and rate-limited. Downloads up to 10,000 rows as an
