              schema:
                type: object
                required: [status, totalProjects, withPdfFiles, withoutPdfFiles, withPdfLinks, withPdf, withoutPdf, coverage]
                properties:
                  status: { type: string, enum: [ok] }
                  totalProjects: { type: integer }
                  withPdfFiles: { type: integer }
                  withoutPdfFiles: { type: integer }
                  withPdfLinks: { type: integer }
                  withPdf: { type: integer }
                  withoutPdf: { type: integer }
                  coverage: { type: string }
        "401":
          description: "Authentication required. Code `UNAUTHORIZED`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "403":
          description: "Missing pipeline:read scope. Codes `INSUFFICIENT_SCOPE`, `FORBIDDEN_ORIGIN`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "500":
          description: "Scraping status check failed. Code `STATUS_CHECK_FAILED`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PipelineFailure' }

  /scraping/trigger:
    post:
      summary: Trigger TOR document scraping for open software projects
      description: "Requires `pipeline:trigger`. Direct remote document fetches use the application's URL safety checks."
      tags: [Pipeline]
      operationId: triggerScraping
      security: [{ sessionAuth: [] }, { scopedJwtBearer: [] }, { pipelineBearer: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                projectId: { type: string }
                batchSize: { type: integer, minimum: 1, maximum: 50, default: 10 }
                onlyMissing: { type: boolean, default: true }
                delayMs:
                  description: Delay between requests in milliseconds. Numeric strings are converted to numbers and checked against the same integer bounds. The default is the configured delay or 4000 ms.
                  oneOf:
                    - { type: integer, minimum: 3000, maximum: 60000 }
                    - { type: string, minLength: 1 }
      responses:
        "200":
          description: "Single-project or batch scraping result"
          content:
            application/json:
              schema:
                type: object
                required: [status, mode]
                properties:
                  status: { type: string, enum: [completed, skipped] }
                  mode: { type: string, enum: [single, batch] }
                  dbUpdated: { type: boolean }
                  result: { type: object, additionalProperties: true }
                  reason: { type: string }
                  eligibility: { type: object, nullable: true, additionalProperties: true }
                  message: { type: string }
                  rateLimit:
                    type: object
                    required: [delayMs]
                    properties:
                      delayMs: { type: integer }
                  summary:
                    type: object
                    required: [total, success, failed, skipped]
                    properties:
                      total: { type: integer }
                      success: { type: integer }
                      failed: { type: integer }
                      skipped: { type: integer }
                      dbUpdated: { type: integer }
                  eligibilitySkipped: { type: array, items: { type: object, additionalProperties: true } }
                  results: { type: array, items: { type: object, additionalProperties: true } }
        "400":
          description: "Invalid scraping request. Code `INVALID_SCRAPING_REQUEST`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PipelineFailure' }
        "401":
          description: "Authentication required. Code `UNAUTHORIZED`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "403":
          description: "Missing pipeline:trigger scope or forbidden Origin. Codes `INSUFFICIENT_SCOPE`, `FORBIDDEN_ORIGIN`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "500":
          description: "Scraping failed. Code `SCRAPING_FAILED`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PipelineFailure' }

  /processing/status:
    get:
      summary: Read background OCR/AI processing queue status
      description: "Requires `pipeline:read`. A nonempty projectId takes precedence over jobId. Omit both to read aggregate counts."
      tags: [Pipeline]
      operationId: getProcessingStatus
      security: [{ sessionAuth: [] }, { scopedJwtBearer: [] }, { pipelineBearer: [] }]
      parameters:
        - name: projectId
          in: query
          schema: { type: string }
        - name: jobId
          in: query
          description: Processing job ID, normally a MongoDB ObjectId. A malformed ID may return 500.
          schema: { type: string }
      responses:
        "200":
          description: "Job, project, or aggregate processing status"
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [ok] }
                  job: { type: object, additionalProperties: true }
                  project: { type: object, additionalProperties: true }
                  jobs: { type: object, additionalProperties: { type: integer } }
                  projects: { type: object, additionalProperties: { type: integer } }
        "401":
          description: "Authentication required. Code `UNAUTHORIZED`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "403":
          description: "Missing pipeline:read scope. Codes `INSUFFICIENT_SCOPE`, `FORBIDDEN_ORIGIN`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "404":
          description: "JOB_NOT_FOUND for a missing job. A missing project returns status not_found with project set to null."
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/PipelineFailure' }
                  - type: object
                    required: [status, project]
                    properties:
                      status: { type: string, enum: [not_found] }
                      project: { type: object, nullable: true, additionalProperties: true }
        "500":
          description: "Processing status check failed. Code `PROCESSING_STATUS_FAILED`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PipelineFailure' }

  /processing/trigger:
    post:
      summary: Enqueue projects or candidates for background OCR/AI processing
      description: "Requires `pipeline:trigger`. Supply at most one of projectId and candidateId. The scanLimit, afterId, dryRun and retryFailed fields apply only to bulk requests."
      tags: [Pipeline]
      operationId: triggerProcessing
      security: [{ sessionAuth: [] }, { scopedJwtBearer: [] }, { pipelineBearer: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                projectId: { type: string }
                candidateId: { type: string }
                batchSize: { type: integer, minimum: 1, maximum: 100, default: 10 }
                scanLimit: { type: integer, minimum: 1, maximum: 1000, default: 100 }
                afterId: { type: string, nullable: true }
                dryRun: { type: boolean, default: false }
                retryFailed: { type: boolean, default: false }
      responses:
        "202":
          description: "Jobs accepted or a bulk recovery report returned"
          content:
            application/json:
              schema:
                type: object
                required: [status, queued, reused, jobs]
                properties:
                  status: { type: string, enum: [accepted] }
                  queued: { type: integer }
                  reused: { type: integer }
                  jobs:
                    type: array
                    items:
                      type: object
                      required: [id, projectId, status, reused]
                      properties:
                        id: { type: string }
                        projectId: { type: string }
                        status: { type: string }
                        reused: { type: boolean }
                        type: { type: string }
                  dryRun: { type: boolean }
                  scanned: { type: integer }
                  wouldQueue: { type: integer }
                  failed: { type: integer }
                  skipped: { type: object, additionalProperties: { type: integer } }
                  entries: { type: array, items: { type: object, additionalProperties: true } }
                  nextAfterId: { type: string, nullable: true }
                  exhausted: { type: boolean }
        "400":
          description: "Invalid processing request. Code `INVALID_PROCESSING_REQUEST`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PipelineFailure' }
        "401":
          description: "Authentication required. Code `UNAUTHORIZED`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "403":
          description: "Missing pipeline:trigger scope or forbidden Origin. Codes `INSUFFICIENT_SCOPE`, `FORBIDDEN_ORIGIN`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "500":
          description: "Processing enqueue failed. Code `PROCESSING_ENQUEUE_FAILED`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PipelineFailure' }

  /processing/review:
    get:
      summary: List uncertain or failed processing items for admin review
      description: "Requires the admin role and admin:read scope."
      tags: [Admin - Classification]
      operationId: listProcessingReviewQueue
      security: [{ sessionAuth: [] }, { scopedJwtBearer: [] }]
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
      responses:
        "200":
          description: "Paginated review queue"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LegacyProjectPage' }
        "401":
          description: "Authentication required. Code `UNAUTHORIZED`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "403":
          description: "Admin role and admin:read required. Codes `INSUFFICIENT_SCOPE`, `FORBIDDEN_ORIGIN`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "500":
          description: "Processing review queue could not be loaded. Code `REVIEW_QUEUE_FAILED`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /projects:
    get:
      summary: List and filter ingested projects (legacy route)
      tags: [TORs]
      operationId: listLegacyProjects
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
        - name: isSoftware
          in: query
          schema: { type: boolean }
        - name: agency
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string }
        - name: dateFrom
          in: query
          schema:
            oneOf:
              - { type: string, format: date }
              - { type: string, format: date-time }
        - name: dateTo
          in: query
          schema:
            oneOf:
              - { type: string, format: date }
              - { type: string, format: date-time }
        - name: search
          in: query
          schema: { type: string, maxLength: 200 }
      responses:
        "200":
          description: "Paginated projects list"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LegacyProjectPage' }
        "400":
          description: "Invalid query parameters. Codes `INVALID_IS_SOFTWARE`, `INVALID_DATE_RANGE`, `INVALID_SEARCH`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "429": { $ref: '#/components/responses/RateLimited' }
        "500":
          description: "Failed to list projects. Code `LIST_PROJECTS_FAILED`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /projects/{id}:
    get:
      summary: Get a single project by id (legacy route)
      tags: [TORs]
      operationId: getLegacyProject
      parameters:
        - $ref: "#/components/parameters/TorIdParam"
      responses:
        "200":
          description: "Project details"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LegacyProject' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404":
          description: "Project not found. Code `PROJECT_NOT_FOUND`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: '#/components/responses/RateLimited' }
        "500":
          description: "Failed to load project. Code `GET_PROJECT_FAILED`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /projects/{id}/classification:
    patch:
      summary: Manually approve or reject software classification on a project
      description: "Requires the admin role and tor:write scope. Browser requests require an allowed Origin."
      tags: [Admin - Classification]
      operationId: patchLegacyProjectClassification
      security: [{ sessionAuth: [] }, { scopedJwtBearer: [] }]
      parameters:
        - $ref: "#/components/parameters/TorIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [isSoftware]
              properties:
                isSoftware: { type: boolean }
                reason:
                  type: string
                  default: Manual review
                  description: The handler uses at most the first 1,000 characters.
      responses:
        "200":
          description: "Updated project"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LegacyProject' }
        "400":
          description: "Invalid classification body. Code `INVALID_CLASSIFICATION`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "401":
          description: "Authentication required. Code `UNAUTHORIZED`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "403":
          description: "Admin role and tor:write required. Codes `INSUFFICIENT_SCOPE`, `FORBIDDEN_ORIGIN`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "404":
          description: "Project not found. Code `PROJECT_NOT_FOUND`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "500":
          description: "Failed to update classification. Code `CLASSIFICATION_UPDATE_FAILED`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "503":
          description: "Classification saved but processing queue unavailable. Code `CLASSIFICATION_ENQUEUE_FAILED`."
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Error' }
                  - type: object
                    required: [classificationSaved, projectId]
                    properties:
                      classificationSaved: { type: boolean, enum: [true] }
                      projectId: { type: string }

  /notifications/test:
    post:
      summary: Send a test match-notification email to the signed-in user
      description: >
        Requires notifications:test. The optional JSON body is limited to 16 KiB.
        Omitting matches or setting it to null uses sample matches. The recipient
        is the authenticated user's stored email address.
      tags: [Notifications]
      operationId: sendTestNotification
      security: [{ sessionAuth: [] }, { scopedJwtBearer: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                matches:
                  type: array
                  nullable: true
                  minItems: 1
                  maxItems: 20
                  items:
                    type: object
                    required: [torId, title, agency, budget, matchScore]
                    properties:
                      torId: { type: string, minLength: 1, maxLength: 64 }
                      title: { type: string, minLength: 1, maxLength: 300 }
                      agency: { type: string, maxLength: 200 }
                      budget: { type: number, minimum: 0, maximum: 1000000000000000 }
                      matchScore: { type: number, minimum: 0, maximum: 100 }
      responses:
        "200":
          description: "Test notification was sent"
          content:
            application/json:
              schema:
                type: object
                required: [status, emailId, sentTo]
                properties:
                  status: { type: string, enum: [success] }
                  emailId: { type: string }
                  sentTo: { type: string, format: email }
        "400":
          description: "Malformed JSON, invalid root object or invalid matches. Codes `INVALID_BODY`, `INVALID_MATCHES`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "401":
          description: "Authentication required. Code `UNAUTHORIZED`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthenticationError' }
        "403":
          description: "Forbidden origin or missing notifications:test scope. Codes `INSUFFICIENT_SCOPE`, `FORBIDDEN_ORIGIN`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "404":
          description: "User not found"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageError' }
        "413":
          description: "Request payload exceeds 16 KiB limit. Code `PAYLOAD_TOO_LARGE`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "500":
          description: "Failed to send notification"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageError' }

  /notifications/digest:
    get:
      summary: Dispatch pending daily digest match notifications (GET alias for cron)
      description: >
        Dispatches persisted pending matches. Requires an admin with notifications:send
        or the configured cron bearer credential. The Origin policy treats this GET as a mutation.
      tags: [Notifications]
      operationId: getNotificationsDigest
      security: [{ sessionAuth: [] }, { scopedJwtBearer: [] }, { cronBearer: [] }]
      responses:
        "200":
          description: "Digest dispatch totals"
          content:
            application/json:
              schema:
                type: object
                required: [status, notified, skipped]
                properties:
                  status: { type: string, enum: [success] }
                  notified: { type: integer }
                  skipped: { type: integer }
        "401":
          description: "Authentication required. Code `UNAUTHORIZED`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "403":
          description: "Missing notifications:send permission or forbidden Origin. Codes `INSUFFICIENT_SCOPE`, `FORBIDDEN_ORIGIN`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      summary: Dispatch pending daily digest match notifications
      description: >
        Dispatches persisted pending matches. Requires an admin with notifications:send
        or the configured cron bearer credential. The request body is unused.
      tags: [Notifications]
      operationId: triggerNotificationsDigest
      security: [{ sessionAuth: [] }, { scopedJwtBearer: [] }, { cronBearer: [] }]
      responses:
        "200":
          description: "Digest dispatch totals"
          content:
            application/json:
              schema:
                type: object
                required: [status, notified, skipped]
                properties:
                  status: { type: string, enum: [success] }
                  notified: { type: integer }
                  skipped: { type: integer }
        "401":
          description: "Authentication required. Code `UNAUTHORIZED`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "403":
          description: "Missing notifications:send permission or forbidden Origin. Codes `INSUFFICIENT_SCOPE`, `FORBIDDEN_ORIGIN`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /test-db:
    get:
      summary: Check MongoDB Atlas database connectivity (admin diagnostic)
      description: "Requires the admin role and admin:read scope."
      tags: [Pipeline]
      operationId: testDatabaseConnection
      security: [{ sessionAuth: [] }, { scopedJwtBearer: [] }]
      responses:
        "200":
          description: "Database connection succeeded"
          content:
            application/json:
              schema:
                type: object
                required: [status, message]
                properties:
                  status: { type: string, enum: [connected] }
                  message: { type: string }
        "401":
          description: "Authentication required. Code `UNAUTHORIZED`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "403":
          description: "Admin role and admin:read required. Codes `INSUFFICIENT_SCOPE`, `FORBIDDEN_ORIGIN`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "500":
          description: "Database connection failed"
          content:
            application/json:
              schema:
                type: object
                required: [status, message]
                properties:
                  status: { type: string, enum: [error] }
                  message: { type: string }

components:
  headers:
    OAuthStateCookie:
      description: HTTP-only OAuth state cookie with a 600-second lifetime.
      schema: { type: string }
    GoogleConsentLocation:
      description: Google consent screen URL.
      schema: { type: string, format: uri }

  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: mtn_session
      description: >
        Signed version-2 JWT session cookie with role-bounded scopes, a session
        identifier and an account session version. Revoked sessions and sessions
        for disabled accounts are rejected.
        Public TOR reads permit guests; profile routes require profile:read/write
        and always target the signed-in owner. Admin routes require admin role
        plus admin:read/write or tor:write. Legacy sessions require re-login.
    scopedJwtBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Signed version-2 JWT checked against the same account status, revocation, role and scope rules as the session cookie.
    pipelineBearer:
      type: http
      scheme: bearer
      description: >
        PIPELINE_ADMIN_TOKEN (at least 32 characters), limited to pipeline:read
        and pipeline:trigger on the standalone pipeline endpoints. A server-to-server
        request with a valid explicit bearer credential may omit Origin. An Origin,
        when supplied, must be allowed.

    cronBearer:
      type: http
      scheme: bearer
      description: Configured CRON_SECRET of at least 32 characters, limited to scheduled digest dispatch. A server-to-server request may omit Origin. A supplied Origin must be allowed.

  responses:
    Unauthorized:
      description: "Authentication required or invalid credentials. Code `UNAUTHORIZED`."
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: "Insufficient role or scope, or missing or disallowed Origin. Codes `INSUFFICIENT_SCOPE`, `FORBIDDEN_ORIGIN`."
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: "Request limit exceeded. Code `RATE_LIMITED`."
      headers:
        Retry-After:
          description: Seconds until another request can be made.
          schema: { type: integer, minimum: 1 }
        X-RateLimit-Limit:
          description: Maximum requests in the active window.
          schema: { type: integer, minimum: 1 }
        X-RateLimit-Remaining:
          description: Requests remaining in the active window.
          schema: { type: integer, minimum: 0 }
        X-RateLimit-Reset:
          description: Window reset time in Unix seconds.
          schema: { type: integer, minimum: 0 }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  parameters:
    OAuthNextParam:
      name: next
      in: query
      description: Local destination to use after successful sign-in.
      schema: { type: string }
    TorIdParam:
      name: id
      in: path
      required: true
      schema:
        type: string
      example: "TOR-2569-014"
    BidPrepDraftIdParam:
      name: id
      in: path
      required: true
      description: Draft id owned by the signed-in user. Anyone else's id is not found.
      schema:
        type: string
        pattern: "^[a-f0-9]{24}$"
    BidPrepProjectIdParam:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,63}$'
      example: TOR-2569-001
    PageParam:
      name: page
      in: query
      description: 1-indexed page number. Defaults to 1.
      schema:
        type: integer
        minimum: 1
        maximum: 9007199254740991
        default: 1
    PageSizeParam:
      name: pageSize
      in: query
      description: Items per page. Defaults to 20, max 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    LimitParam:
      name: limit
      in: query
      description: Items per page. Defaults to 10, max 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
    AnalyticsLimitParam:
      name: limit
      in: query
      description: Page size. Takes precedence over pageSize when supplied. Defaults to 10.
      schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
    AnalyticsPageSizeAliasParam:
      name: pageSize
      in: query
      description: Alternative page size used when limit is absent.
      schema: { type: integer, minimum: 1, maximum: 100 }

  schemas:
    AcquisitionHealth:
      type: object
      required: [status]
      description: Latest 100 production acquisition attempts retained for 90 days. Excludes benchmark probes and OCR/Vertex success. A proposed 90 percent target needs team acceptance.
      properties:
        status: { type: string, enum: [healthy, degraded, insufficient_data, unavailable] }
        attempted: { type: integer, minimum: 0 }
        succeeded: { type: integer, minimum: 0 }
        failed: { type: integer, minimum: 0 }
        skipped: { type: integer, minimum: 0 }
        successRate: { type: number, minimum: 0, maximum: 1, nullable: true }
        consecutiveFailures: { type: integer, minimum: 0 }
        lastSuccessAt: { type: string, format: date-time, nullable: true }
        lastAttemptAt: { type: string, format: date-time, nullable: true }
        stale: { type: boolean }
        bySource: { type: object, additionalProperties: { type: object } }
        byRun: { type: object, additionalProperties: { type: object } }
        policy: { type: object }
        scope: { type: string }
    AdminPipelineRun:
      type: object
      required: [id, status, phase, startedAt, completedAt, progress, summary, error, errorCode]
      properties:
        id: { type: string, nullable: true }
        status: { type: string, enum: [idle, running, completed, failed] }
        phase: { type: string }
        startedAt: { type: string, format: date-time, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }
        error: { type: string, nullable: true }
        errorCode: { type: string, nullable: true }
        progress:
          type: object
          required: [current, total, percent, stage, message]
          properties:
            current: { type: integer }
            total: { type: integer }
            percent: { type: integer, minimum: 0, maximum: 100 }
            stage: { type: string }
            message: { type: string }
        summary:
          type: object
          required: [discovered, candidates, documentsAcquired, processed, notified, errors]
          properties:
            discovered: { type: integer }
            candidates: { type: integer }
            documentsAcquired: { type: integer }
            processed: { type: integer }
            notified: { type: integer }
            errors: { type: array, items: { type: object } }
    LowConfidenceReviewPage:
      type: object
      required: [items, total, page, pageSize, totalPages, threshold, confidenceType]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/LowConfidenceReviewItem" }
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1, maximum: 1000000 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        totalPages: { type: integer, minimum: 0 }
        threshold: { type: number, enum: [0.7] }
        confidenceType: { type: string, enum: [either, classification, extraction] }

    LowConfidenceReviewItem:
      type: object
      required: [projectId, projectTitle, issuingAgency, titleSource, agencySource,
        classificationTags, isSoftware, classificationStatus, confidenceScore,
        confidenceScores, reviewReasons, primaryPdfUrl, primaryDocumentUrl,
        primaryDocumentType, primaryPdfEntryName, processingStatus]
      properties:
        projectId: { type: string }
        projectTitle: { type: string, nullable: true }
        issuingAgency: { type: string, nullable: true }
        titleSource: { type: string, enum: [extracted, government_metadata] }
        agencySource: { type: string, enum: [extracted, government_metadata] }
        classificationTags: { type: array, items: { type: string } }
        isSoftware: { type: boolean, nullable: true }
        classificationStatus: { type: string }
        confidenceScore:
          type: number
          minimum: 0
          maximum: 0.7
          description: Selected confidence on the 0..1 scale, strictly less than 0.70.
        confidenceScores:
          type: object
          required: [classification, extraction]
          properties:
            classification: { type: number, nullable: true, minimum: 0, maximum: 1 }
            extraction: { type: number, nullable: true, minimum: 0, maximum: 1 }
        reviewReasons: { type: array, items: { type: string, enum: [low_classification_confidence, low_extraction_confidence] } }
        primaryPdfUrl: { type: string, nullable: true, format: uri }
        primaryDocumentUrl: { type: string, nullable: true, format: uri }
        primaryDocumentType: { type: string, nullable: true, enum: [pdf, archive] }
        primaryPdfEntryName: { type: string, nullable: true }
        processingStatus: { type: string, nullable: true }

    TorStatus:
      type: string
      enum: [Active, Superseded, Invalid, Cancelled]

    KeywordCategory:
      type: string
      enum: [software, non-software]

    Tor:
      type: object
      required:
        - id
        - title
        - agency
        - budget
        - releaseDate
        - sourceUrl
        - status
        - isSoftware
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          description: Unique project id or URL-hash-derived identifier (FR-1.1.3 dedup key).
        title:
          type: string
        agency:
          type: string
          description: Issuing BMA agency name.
        budget:
          type: number
          description: Announced budget in THB.
        releaseDate:
          type: string
          format: date
        sourceUrl:
          type: string
          format: uri
        pdfUrl:
          type: string
          format: uri
          nullable: true
        status:
          $ref: "#/components/schemas/TorStatus"
        isSoftware:
          type: boolean
          nullable: true
          description: null = not yet classified.
        classificationConfidence:
          type: number
          nullable: true
          minimum: 0
          maximum: 1
          description: Classifier confidence score, null if not yet classified or manually overridden.
        supersededByTorId:
          type: string
          nullable: true
          description: "[FR-1.3] Id of the newer revision, if this record's status is Superseded."
        matchScore:
          type: number
          nullable: true
          minimum: 0
          maximum: 100
          description: "[Current] Populated only when returned via an authenticated endpoint for a contractor with a profile."
        budgetAnomaly:
          type: object
          nullable: true
          description: "[Current]"
          allOf:
            - $ref: "#/components/schemas/BudgetAnomaly"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ClassificationOverride:
      type: object
      required: [id, target, reviewer, reason, before, after, createdAt]
      properties:
        id: { type: string }
        target: { type: string, enum: [project, candidate] }
        reviewer:
          type: object
          required: [userId, email, via]
          properties:
            userId: { type: string, nullable: true }
            email: { type: string, nullable: true }
            via: { type: string, enum: [admin_session, pipeline_token] }
        reason: { type: string, nullable: true }
        before: { type: object }
        after: { type: object }
        createdAt: { type: string, format: date-time }

    TorApiClassification:
      type: object
      required: [status, confidence]
      properties:
        status:
          type: string
          nullable: true
          enum: [pending, software, not_software, uncertain, manual_override]
        confidence:
          type: number
          nullable: true
          minimum: 0
          maximum: 1

    TorListItem:
      type: object
      required: [id, title, agency, budget, projectStatus, bidding, announceDate, contractStart, contractEnd, isSoftware, classification, documentStatus, processingStatus, techStack, anomaly]
      properties:
        fiscalBudget: { $ref: "#/components/schemas/TorFiscalBudget" }
        id: { type: string }
        title: { type: string }
        agency: { type: string }
        budget: { type: number, nullable: true, description: "Announced budget in THB. Falls back to tender reference price when available." }
        projectStatus: { type: string }
        bidding:
          $ref: "#/components/schemas/TorApiBidding"
        isLatestVersion: { type: boolean }
        supersededBy: { type: string, nullable: true, description: "Id of the newer revision, if any." }
        announceDate: { type: string, format: date-time, nullable: true }
        contractStart: { type: string, format: date-time, nullable: true, description: "Contract start; currently used only by the temporary TOR-stage display." }
        contractEnd: { type: string, format: date-time, nullable: true, description: "Contract end, not a bidding deadline." }
        isSoftware: { type: boolean, nullable: true }
        classification:
          $ref: "#/components/schemas/TorApiClassification"
        documentStatus: { type: string, nullable: true }
        processingStatus: { type: string, nullable: true }
        techStack:
          type: array
          items: { type: string }
        anomaly:
          $ref: "#/components/schemas/TorListAnomaly"

    TorApiBidding:
      type: object
      required: [status, opensAt, closesAt, submissionDate, submissionStartTime, submissionEndTime, invitationUrl, method]
      properties:
        phase: { type: string, nullable: true, description: "Raw tender phase, separate from live bidding availability." }
        status: { type: string, enum: [open, closed, cancelled, unknown], description: "Calculated at response time from the bid-submission deadline; cancelled is retained from the source." }
        opensAt: { type: string, format: date-time, nullable: true, description: "Exact bid-submission session start in Asia/Bangkok." }
        closesAt: { type: string, format: date-time, nullable: true, description: "Exact bid-submission session end in Asia/Bangkok. The dashboard uses this as the live deadline." }
        submissionDate: { type: string, format: date, nullable: true }
        submissionStartTime: { type: string, nullable: true, example: "09:00" }
        submissionEndTime: { type: string, nullable: true, example: "12:00" }
        invitationUrl: { type: string, format: uri, nullable: true }
        method: { type: string, nullable: true }

    TorListAnomaly:
      type: object
      required: [highBudgetFlag, budgetDeviationMultiplier]
      properties:
        highBudgetFlag: { type: boolean }
        budgetDeviationMultiplier: { type: number }
        baselinePrice: { type: number, nullable: true }
        baselineSampleCount: { type: integer, minimum: 0 }
        baselineMethod: { type: string, enum: [historical_category_median, tor_budget_fallback, unavailable] }
        tags: { type: array, items: { type: string } }

    TorListResponse:
      type: object
      required: [status, page, limit, total, data]
      properties:
        status: { type: string, enum: [success] }
        page: { type: integer, minimum: 1 }
        limit: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }
        data:
          type: array
          items:
            $ref: "#/components/schemas/TorListItem"

    TorApiAnomaly:
      oneOf:
        - type: object
          required: [type, budgetDeviationMultiplier]
          properties:
            type: { type: string, enum: [high_budget] }
            tag: { type: string, enum: [HIGH_BUDGET_ANOMALY] }
            budgetDeviationMultiplier: { type: number }
            baselinePrice: { type: number, nullable: true }
            baselineSampleCount: { type: integer, minimum: 0 }
            baselineMethod: { type: string, enum: [historical_category_median, tor_budget_fallback, unavailable] }
            tags: { type: array, items: { type: string } }
        - type: object
          required: [type, clauseText, reason, explanation]
          properties:
            type: { type: string, enum: [flagged_clause] }
            clauseText: { type: string }
            reason: { type: string }
            explanation: { type: string }
            highlightReason: { type: string }
            category:
              type: string
              enum: [unrealistic_tenure, excessive_hardware, vendor_lock_in]
            severity:
              type: string
              enum: [low, medium, high]
            page: { type: integer, minimum: 1 }
            confidence: { type: number, minimum: 0, maximum: 1 }

    TorFiscalBudget:
      type: object
      nullable: true
      required: [year, years, status, method, evidence]
      properties:
        warnings: { type: array, items: { type: string } }
        year: { type: integer, nullable: true, minimum: 2500, maximum: 2699 }
        years: { type: array, items: { type: integer, minimum: 2500, maximum: 2699 } }
        status: { type: string, enum: [found, not_found, ambiguous, document_unavailable] }
        source: { type: string, enum: [announcement, tor, combined] }
        needs_review: { type: boolean }
        method: { type: string, enum: [none, regex, llm, regex+llm] }
        evidence:
          type: array
          items:
            type: object
            required: [year, page, clause_text, section, method]
            properties:
              year: { type: integer, minimum: 2500, maximum: 2699 }
              page: { type: integer, minimum: 1 }
              clause_text: { type: string }
              section: { type: string, nullable: true }
              method: { type: string, enum: [regex, llm] }

    TorDocument:
      type: object
      nullable: true
      properties:
        id: { type: string, nullable: true }
        type: { type: string }
        filename: { type: string, nullable: true }
        sourceUrl: { type: string, nullable: true }
        mimeType: { type: string, nullable: true }
        sizeBytes: { type: number, nullable: true }
        status: { type: string, nullable: true }
        version: { type: number, nullable: true }
        isCurrentPrimary: { type: boolean }

    TorDetail:
      type: object
      required: [id, title, agency, budget, projectStatus, pdfUrl, createdAt, updatedAt, timeline, classification, documentStatus, processingStatus, requirements, scopeOfWork, techStack, summary, anomalies, version]
      properties:
        bidding: { $ref: "#/components/schemas/TorApiBidding" }
        documents:
          type: object
          properties:
            tor: { $ref: "#/components/schemas/TorDocument" }
            announcement: { $ref: "#/components/schemas/TorDocument" }
        id: { type: string }
        title: { type: string }
        agency:
          type: object
          required: [name, subName]
          properties:
            name: { type: string }
            subName: { type: string, nullable: true }
        budget: { type: number, nullable: true }
        projectStatus: { type: string }
        pdfUrl: { type: string, format: uri, nullable: true }
        createdAt: { type: string, format: date-time, nullable: true }
        updatedAt: { type: string, format: date-time, nullable: true }
        timeline:
          type: object
          required: [announceDate, contractStart, contractEnd, durationDays]
          properties:
            announceDate: { type: string, format: date-time, nullable: true }
            contractStart: { type: string, format: date-time, nullable: true }
            contractEnd: { type: string, format: date-time, nullable: true }
            durationDays: { type: integer, nullable: true }
        classification:
          allOf:
            - $ref: "#/components/schemas/TorApiClassification"
            - type: object
              required: [isSoftware, reason]
              properties:
                isSoftware: { type: boolean, nullable: true }
                reason: { type: string, nullable: true }
                tags:
                  type: array
                  items: { type: string }
                  description: Admin-assigned tags (FR-1.2.2).
                reviewedBy:
                  type: object
                  nullable: true
                  description: Admin who last overrode the classification or document status. Only returned by the admin override endpoint.
                  required: [userId, email, via]
                  properties:
                    userId: { type: string, nullable: true }
                    email: { type: string, nullable: true }
                    via: { type: string, enum: [admin_session, pipeline_token] }
                reviewedAt: { type: string, format: date-time, nullable: true }
        documentStatus: { type: string, nullable: true }
        processingStatus: { type: string, nullable: true }
        requirements: { type: array, items: { type: string } }
        scopeOfWork: { type: array, items: { type: string } }
        techStack: { type: array, items: { type: string } }
        summary: { type: string, nullable: true }
        fiscalBudget: { $ref: "#/components/schemas/TorFiscalBudget" }
        anomalies:
          type: array
          items:
            $ref: "#/components/schemas/TorApiAnomaly"
        version:
          type: object
          required: [number, isLatest, supersededBy, supersedes, lineageId]
          description: >-
            Position in the re-announcement lineage (FR-1.3). Re-announced tenders
            from the same agency with matching titles are linked V1 -> V2 -> ...;
            for a project outside a lineage, number counts revisions of its own TOR PDF.
          properties:
            number: { type: integer, minimum: 1 }
            isLatest: { type: boolean }
            supersededBy: { type: string, nullable: true, description: Id of the next revision. }
            supersedes: { type: string, nullable: true, description: Id of the previous revision. }
            lineageId: { type: string, nullable: true, description: "Id of the first revision, null outside a lineage." }

    TorApiEvidence:
      type: object
      required: [value]
      properties:
        value: { type: string }
        page: { type: integer, minimum: 1 }

    TorApiSummary:
      type: object
      required: [id, documentStatus, processingStatus, summary, requirements, scopeOfWork, techStack, evidence]
      properties:
        id: { type: string }
        documentStatus: { type: string, nullable: true }
        processingStatus: { type: string, nullable: true }
        summary: { type: string, nullable: true }
        fiscalBudget: { $ref: "#/components/schemas/TorFiscalBudget" }
        requirements: { type: array, items: { type: string } }
        scopeOfWork: { type: array, items: { type: string } }
        techStack: { type: array, items: { type: string } }
        evidence:
          type: object
          required: [requirements, scopeOfWork, techStack]
          properties:
            requirements: { type: array, items: { $ref: "#/components/schemas/TorApiEvidence" } }
            scopeOfWork: { type: array, items: { $ref: "#/components/schemas/TorApiEvidence" } }
            techStack: { type: array, items: { $ref: "#/components/schemas/TorApiEvidence" } }

    TorApiAnomalyReport:
      type: object
      required: [id, highBudgetFlag, budgetDeviationMultiplier, anomalies]
      properties:
        id: { type: string }
        highBudgetFlag: { type: boolean }
        budgetDeviationMultiplier: { type: number }
        baselinePrice: { type: number, nullable: true }
        baselineSampleCount: { type: integer, minimum: 0 }
        baselineMethod: { type: string, enum: [historical_category_median, tor_budget_fallback, unavailable] }
        tags: { type: array, items: { type: string } }
        anomalies:
          type: array
          items:
            $ref: "#/components/schemas/TorApiAnomaly"

    TorSummary:
      type: object
      description: "[Planned, FR-2.1]"
      properties:
        torId:
          type: string
        executiveSummary:
          type: string
        vendorEligibility:
          type: string
        requiredTeamExperience:
          type: string
        requiredTechStack:
          type: array
          items:
            type: string
        requiredCertifications:
          type: array
          items:
            type: string
        generatedAt:
          type: string
          format: date-time

    ClassificationKeyword:
      type: object
      required: [id, keyword, category, updatedAt]
      properties:
        id:
          type: string
        keyword:
          type: string
        category:
          $ref: "#/components/schemas/KeywordCategory"
        updatedBy:
          type: string
          nullable: true
        updatedAt:
          type: string
          format: date-time

    PasswordAuthResult:
      type: object
      required: [user, redirectTo]
      properties:
        user: { $ref: "#/components/schemas/User" }
        redirectTo: { type: string, example: /dashboard }

    User:
      type: object
      description: Public account fields. Password hashes are never returned.
      required: [id, email, role]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        username:
          type: string
          nullable: true
          description: Lowercase unique handle; null for older accounts until `npm run db:migrate-users` has run.
        name:
          type: string
          nullable: true
        role:
          type: string
          enum: [user, admin]

    CompanyPastProject:
      type: object
      required: [name, client, value, year]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        client: { type: string, minLength: 1, maxLength: 200 }
        value: { type: number, minimum: 0, maximum: 1000000000000000 }
        year: { type: integer, minimum: 2400, maximum: 2700, description: Buddhist Era year; preserved without conversion. }
    CompanyProfileUpdate:
      type: object
      description: All fields are optional. Unknown keys are ignored. Empty bid strings and past_projects=[] clear those fields.
      properties:
        name: { type: string, maxLength: 200 }
        company_name: { type: string, maxLength: 200 }
        registration_number: { type: string, maxLength: 100 }
        address: { type: string, maxLength: 2000 }
        authorized_signatory: { type: string, maxLength: 200 }
        past_projects:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/CompanyPastProject" }
        skills:
          type: array
          maxItems: 100
          items: { type: string, maxLength: 100 }
        techStack:
          type: array
          maxItems: 100
          items: { type: string, maxLength: 100 }
        certifications:
          type: array
          maxItems: 100
          items: { type: string, maxLength: 100 }
        registered_capital: { type: number, nullable: true, minimum: 0, maximum: 1000000000000000 }
        highest_past_project_value: { type: number, nullable: true, minimum: 0, maximum: 1000000000000000 }
        concurrent_project_capacity: { type: integer, nullable: true, minimum: 0, maximum: 10000 }
        email_notifications_enabled: { type: boolean }
        match_score_threshold: { type: number, minimum: 0, maximum: 100 }
        notification_frequency: { type: string, enum: [IMMEDIATE, DAILY_DIGEST] }
    CompanyProfileResponse:
      type: object
      required: [status, data]
      properties:
        status: { type: string, enum: [success] }
        data:
          allOf:
            - $ref: "#/components/schemas/CompanyProfileUpdate"
            - type: object
              required: [_id, email, registration_number, address, authorized_signatory, past_projects]
              properties:
                _id: { type: string }
                email: { type: string, format: email }
                updatedAt: { type: string, format: date-time }
    ProfileValidationError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            fields:
              type: object
              additionalProperties: { type: string }

    BudgetAnomalyTag:
      type: string
      enum: [NONE, HIGH_BUDGET_ANOMALY]

    BudgetAnomaly:
      type: object
      description: "[Planned, FR-3.1]"
      properties:
        baselinePrice:
          type: number
          description: Category Average(Scope Category), or the TOR's own budget if no historical category data exists yet.
        deviationMultiplier:
          type: number
          description: TOR Budget / Baseline Price.
        tag:
          $ref: "#/components/schemas/BudgetAnomalyTag"

    FlaggedClause:
      type: object
      description: "[Planned, FR-3.2]"
      required: [clauseText, type, reasoning]
      properties:
        clauseText:
          type: string
        type:
          type: string
          enum: [IRRELEVANT_HARDWARE, UNREALISTIC_TENURE, VENDOR_LOCK_IN, OTHER]
        reasoning:
          type: string
          description: Stored LLM/rule-based reasoning behind the flag (FR-3.2.3).

    AnomalyReport:
      type: object
      description: "[Current]"
      properties:
        torId:
          type: string
        budgetAnomaly:
          $ref: "#/components/schemas/BudgetAnomaly"
        flaggedClauses:
          type: array
          items:
            $ref: "#/components/schemas/FlaggedClause"

    AnalyticsAggregates:
      type: object
      description: "[FR-4.1.3] Spend metrics over every matching project."
      required: [projectCount, totalSpend, meanBudget, medianDuration, softwareCount, summarizedCount, anomalyCount, byAgency, byStatus, topTechnologies]
      properties:
        projectCount: { type: integer }
        totalSpend: { type: number, description: Sum of budgets in THB. }
        meanBudget: { type: number, description: Mean budget in THB of projects with a budget. }
        medianDuration: { type: number, nullable: true, description: Approximate median contract duration in days. }
        softwareCount: { type: integer }
        summarizedCount: { type: integer, description: Projects with an AI summary of their TOR. }
        anomalyCount: { type: integer, description: Projects with a high budget or flagged clauses. }
        byAgency:
          type: array
          description: Agencies ordered by total spend, highest first (top 20).
          items:
            type: object
            required: [agency, projectCount, totalSpend, meanBudget]
            properties:
              agency: { type: string, nullable: true }
              projectCount: { type: integer }
              totalSpend: { type: number }
              meanBudget: { type: number }
        byStatus:
          type: array
          items:
            type: object
            required: [status, projectCount]
            properties:
              status: { type: string }
              projectCount: { type: integer }
        topTechnologies:
          type: array
          items:
            type: object
            required: [technology, projectCount]
            properties:
              technology: { type: string }
              projectCount: { type: integer }

    AnalyticsExportRow:
      type: object
      required: [id, title, agency, subAgency, budget, projectStatus, isSoftware, announceDate, contractStart, contractEnd, durationDays, highBudgetFlag, budgetDeviationMultiplier, updatedAt]
      properties:
        id: { type: string }
        title: { type: string, nullable: true }
        agency: { type: string, nullable: true }
        subAgency: { type: string, nullable: true }
        budget: { type: number, nullable: true }
        projectStatus: { type: string }
        isSoftware: { type: boolean, nullable: true }
        announceDate: { type: string, format: date-time, nullable: true }
        contractStart: { type: string, format: date-time, nullable: true }
        contractEnd: { type: string, format: date-time, nullable: true }
        durationDays: { type: number, nullable: true }
        highBudgetFlag: { type: boolean }
        budgetDeviationMultiplier: { type: number }
        updatedAt: { type: string, format: date-time, nullable: true }

    AnalyticsSearchResponse:
      type: object
      required: [status, generatedAt, filters, dataQuality, metrics, charts, facets, page, limit, total, data]
      properties:
        status: { type: string, enum: [success] }
        generatedAt: { type: string, format: date-time }
        filters: { type: object, description: The validated filter values applied to this response. }
        dataQuality:
          type: object
          description: Identifies temporary field derivations until canonical bidding data exists.
          additionalProperties: { type: string }
        metrics:
          type: object
          required: [totalTors, totalBudget, openForBidding, openBudget, closingSoon]
          properties:
            totalTors: { type: integer, minimum: 0 }
            totalBudget: { type: number, minimum: 0 }
            openForBidding: { type: integer, minimum: 0 }
            openBudget: { type: number, minimum: 0 }
            closingSoon: { type: integer, minimum: 0 }
        charts:
          type: object
          required: [fiscalYearTrend, projectLength, biddingStatus, closingWindow, documentReadiness, topAgencies]
          properties:
            fiscalYearTrend:
              type: array
              items:
                type: object
                required: [fiscalYear, count, totalBudget]
                properties:
                  fiscalYear: { type: integer }
                  count: { type: integer, minimum: 0 }
                  totalBudget: { type: number, minimum: 0 }
            projectLength:
              type: array
              items:
                type: object
                required: [key, label, count, totalBudget]
                properties:
                  key: { type: string, enum: [one, two, threePlus, unknown] }
                  label: { type: string }
                  count: { type: integer, minimum: 0 }
                  totalBudget: { type: number, minimum: 0 }
            biddingStatus:
              type: array
              items: { $ref: "#/components/schemas/AnalyticsBreakdown" }
            closingWindow:
              type: array
              items: { $ref: "#/components/schemas/AnalyticsBreakdown" }
            documentReadiness:
              type: array
              items: { $ref: "#/components/schemas/AnalyticsBreakdown" }
            topAgencies:
              type: array
              items:
                type: object
                required: [name, count, totalBudget]
                properties:
                  name: { type: string }
                  count: { type: integer, minimum: 0 }
                  totalBudget: { type: number, minimum: 0 }
        facets:
          type: object
          required: [agencies, fiscalYears]
          properties:
            agencies:
              type: array
              items:
                type: object
                required: [name, count]
                properties:
                  name: { type: string }
                  count: { type: integer, minimum: 0 }
            fiscalYears:
              type: array
              items:
                type: object
                required: [year, count]
                properties:
                  year: { type: integer }
                  count: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        limit: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }
        data:
          type: array
          items: { $ref: "#/components/schemas/AnalyticsTorItem" }

    AnalyticsBreakdown:
      type: object
      required: [key, count, totalBudget]
      properties:
        key: { type: string }
        count: { type: integer, minimum: 0 }
        totalBudget: { type: number, minimum: 0 }

    AnalyticsTorItem:
      type: object
      required: [id, title, budget, projectStatus, isSoftware, announceDate, bidClosesAt, bidStartsAt, bidSubmissionDate, bidStartTime, bidEndTime, fiscalYear, fiscalYearSource, biddingStatus, documentReadiness, projectLength]
      properties:
        id: { type: string }
        title: { type: string }
        agency: { type: string }
        budget: { type: number, minimum: 0, nullable: true }
        projectStatus: { type: string }
        isSoftware: { type: boolean, nullable: true }
        announceDate: { type: string, format: date-time, nullable: true }
        contractStart: { type: string, format: date-time, nullable: true }
        contractEnd: { type: string, format: date-time, nullable: true }
        fiscalYear: { type: integer, nullable: true }
        biddingStatus: { type: string, enum: [open, closed, cancelled, unknown] }
        fiscalYearSource: { type: string, enum: [document, ambiguous, bid_close_estimate, unknown] }
        bidClosesAt: { type: string, format: date-time, nullable: true }
        bidStartsAt: { type: string, format: date-time, nullable: true }
        bidSubmissionDate: { type: string, format: date, nullable: true }
        bidStartTime: { type: string, nullable: true }
        bidEndTime: { type: string, nullable: true }
        documentReadiness: { type: string, enum: [analysis_ready, tor_ready, announcement_only, no_documents] }
        projectLength: { type: integer, nullable: true, minimum: 1 }

    PaginatedList:
      type: object
      required: [total, page, pageSize]
      properties:
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer

    BidPrepNotices:
      type: object
      required: [aiDraft, noEgpSubmission, noEgpSubmissionTh]
      properties:
        aiDraft: { type: string }
        noEgpSubmission: { type: string }
        noEgpSubmissionTh: { type: string }
    BidPrepDraftSection:
      type: object
      required: [heading, body, sources]
      properties:
        heading: { type: string, maxLength: 200 }
        body: { type: string, maxLength: 8000 }
        sources:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 200 }
    BidPrepDraftSectionInput:
      type: object
      properties:
        heading: { type: string, maxLength: 200 }
        body: { type: string, maxLength: 8000 }
        sources:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 200 }
    BidPrepDraftSummary:
      type: object
      required: [id, projectId, title, version, createdAt, updatedAt, notices]
      properties:
        id: { type: string }
        projectId: { type: string, maxLength: 64 }
        title: { type: string, maxLength: 200 }
        version: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        notices:
          $ref: "#/components/schemas/BidPrepNotices"
    BidPrepDraft:
      allOf:
        - $ref: "#/components/schemas/BidPrepDraftSummary"
        - type: object
          required: [sections]
          properties:
            sections:
              type: array
              maxItems: 40
              items:
                $ref: "#/components/schemas/BidPrepDraftSection"
    BidPrepDraftInput:
      type: object
      description: Owner comes from session.sub. Unknown fields are ignored. Maximum 40 sections and 100000 total text characters including sources. Overlong fields are rejected, not truncated. At most 50 drafts per user (or a lower configured cap); concurrent creation is serialized transactionally.
      required: [projectId]
      properties:
        projectId: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,63}$' }
        title: { type: string, maxLength: 200 }
        sections:
          type: array
          maxItems: 40
          items:
            $ref: "#/components/schemas/BidPrepDraftSectionInput"
    BidPrepDraftPatch:
      type: object
      required: [version]
      properties:
        version: { type: integer, minimum: 1, maximum: 9007199254740991 }
        title: { type: string, maxLength: 200 }
        sections:
          type: array
          maxItems: 40
          items:
            $ref: "#/components/schemas/BidPrepDraftSectionInput"
    BidPrepDeletion:
      type: object
      required: [status, draftsDeleted]
      properties:
        status: { type: string, enum: [deleted] }
        draftsDeleted: { type: integer, minimum: 0 }
    BidPrepChecklistItem:
      type: object
      required: [id, requirement, status, overrideStatus, reason, evidencePages, needsReview]
      properties:
        id: { type: string, pattern: "^[a-f0-9]{64}$" }
        requirement: { type: string }
        status: { type: string, enum: [pass, fail, manual] }
        overrideStatus: { type: string, nullable: true, enum: [pass, fail, manual, null] }
        reason: { type: string }
        evidencePages:
          type: array
          items: { type: integer, minimum: 1 }
        needsReview: { type: boolean }
    BidPrepChecklist:
      type: object
      required: [projectId, notices, summary, missingProfileFields, truncated, items, pastProjectValueComparison]
      properties:
        projectId: { type: string }
        notices:
          $ref: "#/components/schemas/BidPrepNotices"
        summary:
          type: object
          required: [pass, fail, manual]
          properties:
            pass: { type: integer, minimum: 0 }
            fail: { type: integer, minimum: 0 }
            manual: { type: integer, minimum: 0 }
        missingProfileFields:
          type: array
          items: { type: string }
        pastProjectValueComparison:
          type: object
          required: [status, companyValueBaht, minimumBaht, operator, meetsMinimum, evidence]
          properties:
            status: { type: string, enum: [found, not_stated, manual_review, pending_extraction] }
            companyValueBaht: { type: number, minimum: 0, nullable: true }
            minimumBaht: { type: number, minimum: 0, nullable: true }
            operator: { type: string, enum: [">=", ">", null], nullable: true }
            meetsMinimum: { type: boolean, nullable: true }
            evidence:
              type: array
              items:
                type: object
                required: [page, clauseText]
                properties:
                  page: { type: integer, minimum: 1 }
                  clauseText: { type: string }
        truncated: { type: boolean }
        items:
          type: array
          items:
            $ref: "#/components/schemas/BidPrepChecklistItem"

    ProposalDraftSource:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [tor_page, profile_field]
        page:
          type: integer
          minimum: 1
          nullable: true
        field:
          type: string
          nullable: true

    ProposalDraftStatement:
      type: object
      required: [text, sources]
      properties:
        text:
          type: string
        sources:
          type: array
          items:
            $ref: "#/components/schemas/ProposalDraftSource"
        placeholder:
          type: boolean
        missing_source:
          type: boolean

    ProposalScopeResponse:
      type: object
      required: [scope_item, response, sources]
      properties:
        scope_item:
          type: string
        response:
          type: string
        sources:
          type: array
          items:
            $ref: "#/components/schemas/ProposalDraftSource"
        placeholder:
          type: boolean
        missing_source:
          type: boolean

    ProposalPastProject:
      type: object
      required: [name, sources]
      properties:
        name:
          type: string
        client:
          type: string
          nullable: true
        value:
          type: number
          nullable: true
        year:
          type: integer
          nullable: true
        relevance:
          type: string
          nullable: true
        sources:
          type: array
          items:
            $ref: "#/components/schemas/ProposalDraftSource"
        placeholder:
          type: boolean

    ProposalDraft:
      type: object
      required: [warning, model, model_version, prompt_version, company_overview, project_understanding, scope_responses, past_projects]
      properties:
        warning:
          type: string
        model:
          type: string
        model_version:
          type: string
        prompt_version:
          type: string
        company_overview:
          type: array
          items:
            $ref: "#/components/schemas/ProposalDraftStatement"
        project_understanding:
          type: array
          items:
            $ref: "#/components/schemas/ProposalDraftStatement"
        scope_responses:
          type: array
          items:
            $ref: "#/components/schemas/ProposalScopeResponse"
        past_projects:
          type: array
          items:
            $ref: "#/components/schemas/ProposalPastProject"
        dropped_unsourced:
          type: integer
          minimum: 0
        dropped_unsafe:
          type: integer
          minimum: 0

    ProposalDraftAccepted:
      type: object
      required: [status, jobId, jobStatus, reused]
      properties:
        status:
          type: string
          enum: [accepted]
        jobId:
          type: string
        jobStatus:
          type: string
          enum: [queued, running, completed, failed]
        reused:
          type: boolean

    ProposalDraftJob:
      type: object
      required: [jobId, status]
      properties:
        jobId:
          type: string
        status:
          type: string
          enum: [queued, running, completed, failed]
        error:
          type: string
          nullable: true
        warning:
          type: string
        model:
          type: string
        prompt_version:
          type: string
        draft:
          $ref: "#/components/schemas/ProposalDraft"

    MessageError:
      type: object
      required: [error]
      properties:
        error: { type: string }

    AuthenticationError:
      oneOf:
        - { $ref: '#/components/schemas/Error' }
        - { $ref: '#/components/schemas/MessageError' }

    FourDigitCode:
      oneOf:
        - { type: string, pattern: '^\d{4}$' }
        - { type: integer, minimum: 1000, maximum: 9999 }

    PipelineFailure:
      allOf:
        - { $ref: '#/components/schemas/Error' }
        - type: object
          required: [status]
          properties:
            status: { type: string, enum: [error, failed] }

    LegacyProject:
      type: object
      description: Project record using the legacy database field names. Extra stored and hydrated fields may be present.
      required: [project_id]
      properties:
        project_id: { type: string }
        project_name: { type: string, nullable: true }
        dept_name: { type: string, nullable: true }
        budget: { type: number, nullable: true }
        is_software: { type: boolean, nullable: true }

    LegacyProjectPage:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/LegacyProject' } }
        total: { type: integer }
        page: { type: number }
        pageSize: { type: number }

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: "TOR_NOT_FOUND"
            message:
              type: string
              example: "No TOR exists with the given id."
