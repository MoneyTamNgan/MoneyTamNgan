openapi: 3.0.3
info:
  title: MoneyTamNgan API
  description: >
    HTTP API implemented by the MoneyTamNgan Next.js application.
    Browser mutations require an allowed Origin. Requests with an invalid explicit
    bearer credential can receive 401 even on public routes. A disallowed Origin
    can receive 403 on any route. Authenticated requests are checked for account
    status and session revocation. Responses carry the application security headers,
    including a Content-Security-Policy with `base-uri 'none'`.
    Date filters accept ISO dates and timestamps. A date-only upper bound includes
    the entire UTC day. The handlers use JavaScript date parsing.
  version: "0.2.0-draft"
  license:
    name: UNLICENSED
servers:
  - url: http://localhost:3000/api
    description: Local Next.js application

security: []

tags:
  - name: TORs
    description: "[Current] Public/shared endpoints for reading ingested TOR records (FR-1.1, FR-1.2)."
  - name: Admin - Ingestion
    description: "[Current] Monitoring and manual triggering of scraping jobs (FR-1.1)."
  - name: Admin - Classification
    description: "[Current] Reviewing and correcting software/non-software classification (FR-1.2)."
  - name: Admin - Access
    description: "[Current] Extra admin conditions: address allowlist and access code (docs/security/ADMIN_ACCESS.md)."
  - name: Auth
    description: "[Current] Password and Google sign-in, session lookup, and sign-out."
  - name: Contractor Profile
    description: "[Current] Self-reported contractor profile CRUD (FR-2.2)."
  - name: PDF Summary
    description: "[Current] OCR/LLM-extracted structured summary fields on a TOR (FR-2.1)."
  - name: Anomaly Detection
    description: "[Current] Budget and qualification anomaly flags on a TOR (FR-3.1, FR-3.2)."
  - name: Public Analytics
    description: "[Current] Public historical search, dashboard aggregates, and export for the Analytics page."
  - name: Bid preparation
    description: "[Current] Company-data deletion, owned proposal drafts, checklist access and DOCX export. The system does not submit a bid to e-GP (FR-4.7)."
  - name: Bid Preparation
    description: "[Current] Sourced technical proposal drafts for a processed TOR (FR-4.3). Generation is queued and the system does not submit a bid."
  - name: Pipeline
    description: "[Current] Ingestion, scraping, processing queue, and diagnostic operational endpoints."
  - name: Notifications
    description: "[Current] Match email test and daily digest dispatch endpoints."

paths:
  /admin/pipeline/trigger:
    post:
      tags: [Admin - Ingestion]
      summary: Start the complete admin pipeline asynchronously
      description: >
        Admin role and admin:write are required. Cookie mutations require an allowed Origin.
        Returns after the MongoDB lease and audit are committed; discovery, acquisition,
        OCR/Vertex and notifications run through Next after(). No synchronous mode.
        A single MongoDB control record excludes concurrent runs across server instances.
        This is the real route; /admin/ingestion/trigger is not an alias.
      operationId: triggerAdminPipeline
      security: [{ sessionAuth: [] }, { scopedJwtBearer: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                limit: { type: integer, minimum: 1, maximum: 50, default: 5 }
                depts: { type: array, maxItems: 100, items: { type: string, pattern: '^\d{4}$' } }
                projectIds: { type: array, maxItems: 50, description: Count must not exceed limit, items: { type: string, pattern: '^\d{11}$' } }
                allowBrowser: { type: boolean, default: true }
                force: { type: boolean, default: false }
                sync: { type: boolean, enum: [false], default: false, description: Retained for existing clients; true is rejected }
            example:
              limit: 1
              projectIds: ["69110000001"]
              allowBrowser: false
      responses:
        "202":
          description: Run reserved and audited; background work is scheduled
          content:
            application/json:
              schema:
                type: object
                required: [status, jobId, runId, startedAt, statusUrl, run]
                properties:
                  status: { type: string, enum: [accepted] }
                  jobId: { type: string }
                  runId: { type: string, description: Backward-compatible alias for jobId }
                  startedAt: { type: string, format: date-time }
                  statusUrl: { type: string, enum: [/api/admin/pipeline/status] }
                  message: { type: string }
                  run: { $ref: '#/components/schemas/AdminPipelineRun' }
              example:
                status: accepted
                jobId: pipe_1795248000000_308a8381-5191-49a3-9cc5-466c71f5e976
                runId: pipe_1795248000000_308a8381-5191-49a3-9cc5-466c71f5e976
                startedAt: "2026-11-21T08:00:00.000Z"
                statusUrl: /api/admin/pipeline/status
                message: Data pipeline run started in background
                run:
                  id: pipe_1795248000000_308a8381-5191-49a3-9cc5-466c71f5e976
                  status: running
                  phase: starting
                  startedAt: "2026-11-21T08:00:00.000Z"
                  completedAt: null
                  progress: { current: 0, total: 0, percent: 5, stage: initializing, message: Pipeline starting }
                  summary: { discovered: 0, candidates: 0, documentsAcquired: 0, processed: 0, notified: 0, errors: [] }
                  error: null
                  errorCode: null
        "400":
          description: "Invalid JSON, body over 8 KiB, invalid parameters or sync=true. Code `INVALID_PIPELINE_REQUEST`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PipelineFailure' }
        "401":
          description: "Missing or invalid authentication. Code `UNAUTHORIZED`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "403":
          description: "Non-admin or insufficient scope or forbidden Origin. Codes `INSUFFICIENT_SCOPE`, `FORBIDDEN_ORIGIN`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "409":
          description: PIPELINE_ALREADY_RUNNING; no second task is scheduled
          content:
            application/json:
              schema:
                type: object
                required: [status, error, currentRun]
                properties:
                  status: { type: string, enum: [conflict] }
                  error:
                    type: object
                    required: [code, message]
                    properties:
                      code: { type: string, enum: [PIPELINE_ALREADY_RUNNING] }
                      message: { type: string }
                  currentRun: { $ref: '#/components/schemas/AdminPipelineRun' }
        "503":
          description: "Database, audit or scheduling unavailable; work is not launched. Code `PIPELINE_TRIGGER_FAILED`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PipelineFailure' }

  /admin/pipeline/status:
    get:
      tags: [Admin - Ingestion]
      summary: Read persisted admin pipeline status and last start time
      description: Requires the admin role and admin:read. An expired 90-second lease is recovered to failed/PIPELINE_INTERRUPTED. Credentials and lease owner tokens are excluded.
      operationId: getAdminPipelineStatus
      security: [{ sessionAuth: [] }, { scopedJwtBearer: [] }]
      responses:
        "200":
          description: Current persisted run or initial idle state
          content:
            application/json:
              schema:
                type: object
                required: [status, run, dbStats]
                properties:
                  status: { type: string, enum: [ok] }
                  run: { $ref: '#/components/schemas/AdminPipelineRun' }
                  acquisitionHealth: { $ref: '#/components/schemas/AcquisitionHealth' }
                  dbStats:
                    type: object
                    nullable: true
                    properties:
                      totalProjects: { type: integer }
                      withSummary: { type: integer }
              example:
                status: ok
                run:
                  id: null
                  status: idle
                  phase: idle
                  startedAt: null
                  completedAt: null
                  progress: { current: 0, total: 0, percent: 0, stage: idle, message: Pipeline ready }
                  summary: { discovered: 0, candidates: 0, documentsAcquired: 0, processed: 0, notified: 0, errors: [] }
                  error: null
                  errorCode: null
                acquisitionHealth: { status: unavailable }
                dbStats: { totalProjects: 186, withSummary: 120 }
        "401":
          description: "Missing or invalid authentication. Code `UNAUTHORIZED`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "403":
          description: "Admin role and admin:read are required. Codes `INSUFFICIENT_SCOPE`, `FORBIDDEN_ORIGIN`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "500":
          description: "Status database is unavailable. Code `STATUS_CHECK_FAILED`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PipelineFailure' }
    delete:
      tags: [Admin - Ingestion]
      summary: Reset terminal pipeline status to idle
      description: Requires the admin role and admin:write. Cookie mutations require an allowed Origin. Resets terminal state and preserves last startedAt; a live run returns 409.
      operationId: resetAdminPipelineStatus
      security: [{ sessionAuth: [] }, { scopedJwtBearer: [] }]
      responses:
        "200":
          description: Terminal status reset to idle
          content:
            application/json:
              schema:
                type: object
                required: [status, message, run]
                properties:
                  status: { type: string, enum: [ok] }
                  message: { type: string }
                  run: { $ref: '#/components/schemas/AdminPipelineRun' }
        "401":
          description: "Missing or invalid authentication. Code `UNAUTHORIZED`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "403":
          description: "Non-admin or insufficient scope or forbidden Origin. Codes `INSUFFICIENT_SCOPE`, `FORBIDDEN_ORIGIN`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "409":
          description: PIPELINE_ALREADY_RUNNING; live run cannot be reset
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Error' }
                  - type: object
                    required: [status, currentRun]
                    properties:
                      status: { type: string, enum: [conflict] }
                      currentRun: { $ref: '#/components/schemas/AdminPipelineRun' }
        "500":
          description: "Reset database is unavailable. Code `STATUS_RESET_FAILED`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PipelineFailure' }

  # ---------------------------------------------------------------------------
  # Current - Health and TOR routes
  # ---------------------------------------------------------------------------
  /health:
    get:
      summary: Liveness check
      description: Basic health check for FE integration smoke-testing.
      operationId: getHealth
      responses:
        "200":
          description: "Database reachable"
          content:
            application/json:
              schema:
                type: object
                required: [status, database, timestamp]
                properties:
                  status: { type: string, enum: [ok], example: ok }
                  database: { type: string, enum: [connected] }
                  timestamp: { type: string, format: date-time }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "429": { $ref: '#/components/responses/RateLimited' }
        "503":
          description: "Database unavailable"
          content:
            application/json:
              schema:
                type: object
                required: [status, database, message, timestamp]
                properties:
                  status: { type: string, enum: [error] }
                  database: { type: string, enum: [disconnected] }
                  message: { type: string }
                  timestamp: { type: string, format: date-time }

  /tors:
    get:
      summary: List/filter ingested TORs
      tags: [TORs]
      operationId: listTors
      parameters:
        - name: isSoftware
          in: query
          description: Filter by classification result. Omit to include all (including pending/null).
          schema:
            type: boolean
          example: true
        - name: agency
          in: query
          description: Filter by exact issuing agency name.
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: stage
          in: query
          description: Temporary TOR stage derived from contractStart.
          schema:
            type: string
            enum: [draft, official, review, closed]
        - name: biddingStatus
          in: query
          description: Live bidding status calculated from the exact submission deadline. Use unknown for every project without a usable deadline, including cancelled projects.
          schema:
            type: string
            enum: [open, closed, unknown]
        - name: dateFrom
          in: query
          description: Inclusive lower bound on releaseDate (ISO 8601 date).
          schema:
            oneOf:
              - { type: string, format: date }
              - { type: string, format: date-time }
        - name: dateTo
          in: query
          description: Inclusive upper bound on releaseDate. A date-only value includes the entire UTC day.
          schema:
            oneOf:
              - { type: string, format: date }
              - { type: string, format: date-time }
        - name: q
          in: query
          description: Searches project IDs or indexed project text. The handler trims the input and uses its first 200 characters.
          schema: { type: string }
        - name: budgetMin
          in: query
          description: Inclusive minimum project budget in THB.
          schema: { type: number, minimum: 0 }
        - name: budgetMax
          in: query
          description: Inclusive maximum project budget in THB. Must be at least budgetMin if both are supplied.
          schema: { type: number, minimum: 0 }
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
      responses:
        "200":
          description: Paginated list of TORs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TorListResponse"
              example:
                status: success
                page: 1
                limit: 1
                total: 186
                data:
                  - id: "TOR-2569-014"
                    title: "ระบบบริหารจัดการจราจรอัจฉริยะ"
                    agency: "สำนักการจราจรและขนส่ง"
                    budget: 15000000
                    projectStatus: "ระหว่างดำเนินการ"
                    bidding:
                      status: open
                      opensAt: "2026-10-12T02:00:00.000Z"
                      closesAt: "2026-10-12T05:00:00.000Z"
                      submissionDate: "2026-10-12"
                      submissionStartTime: "09:00"
                      submissionEndTime: "12:00"
                      invitationUrl: "https://process5.gprocurement.go.th/invitation.pdf"
                      method: "ประกวดราคาอิเล็กทรอนิกส์ (e-bidding)"
                    announceDate: "2026-08-09T00:00:00.000Z"
                    contractStart: null
                    contractEnd: null
                    isSoftware: true
                    classification: { status: software, confidence: 0.92 }
                    documentStatus: pending
                    processingStatus: ai_pending
                    techStack: [React, Node.js, Cloud]
                    anomaly: { highBudgetFlag: false, budgetDeviationMultiplier: 1 }
        "400":
          description: "Invalid filter parameters. Codes `INVALID_DATE_FROM`, `INVALID_DATE_TO`, `INVALID_DATE_RANGE`, `INVALID_BUDGET_MIN`, `INVALID_BUDGET_MAX`, `INVALID_BUDGET_RANGE`, `INVALID_PAGE`, `INVALID_LIMIT`, `INVALID_IS_SOFTWARE`, `INVALID_STAGE`, `INVALID_BIDDING_STATUS`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "429": { $ref: '#/components/responses/RateLimited' }
        "500":
          description: "Failed to list TORs. Code `LIST_TORS_FAILED`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /tors/facets:
    get:
      summary: List dashboard TOR filter facets
      tags: [TORs]
      operationId: listTorFacets
      parameters:
        - name: isSoftware
          in: query
          description: Restrict facet values and total to software or non-software TORs.
          schema: { type: boolean }
      responses:
        "200":
          description: Complete deduplicated agency list, independent of list pagination.
          content:
            application/json:
              schema:
                type: object
                required: [status, total, agencies]
                properties:
                  status: { type: string, enum: [success] }
                  total: { type: integer, minimum: 0 }
                  agencies:
                    type: array
                    items:
                      type: object
                      required: [name, count]
                      properties:
                        name: { type: string }
                        count: { type: integer, minimum: 1 }
        "400":
          description: "isSoftware must be true or false. Code `INVALID_IS_SOFTWARE`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "429": { $ref: '#/components/responses/RateLimited' }
        "500":
          description: "Failed to list TOR facets. Code `LIST_TOR_FACETS_FAILED`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /tors/{id}:
    get:
      summary: Get a single TOR by id
      tags: [TORs]
      operationId: getTor
      parameters:
        - $ref: "#/components/parameters/TorIdParam"
      responses:
        "200":
          description: TOR detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TorDetail"
        "400":
          description: "Missing TOR id. Code `INVALID_TOR_ID`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404":
          description: "TOR not found. Code `TOR_NOT_FOUND`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429": { $ref: '#/components/responses/RateLimited' }
        "500":
          description: "Failed to load TOR details. Code `GET_TOR_FAILED`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /tors/{id}/proposal-draft:
    post:
      summary: Queue a sourced technical proposal draft
      description: >
        Requires `profile:read`.
        Builds a draft from the TOR's extracted summary, scope, qualifications
        and technology plus the signed-in user's company profile. The request
        body is unused. The handler enqueues a job and returns immediately. Vertex output is checked
        against a response schema. Company facts missing from the profile stay
        as placeholders. The result is an AI draft the user must review; this
        endpoint does not submit a bid.
      tags: [Bid Preparation]
      operationId: createProposalDraft
      security: [{ sessionAuth: [] }, { scopedJwtBearer: [] }]
      parameters:
        - $ref: "#/components/parameters/TorIdParam"
      responses:
        "202":
          description: Draft generation was queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposalDraftAccepted"
              example:
                status: accepted
                jobId: 6550f1b2d4e6a7c809123456
                jobStatus: queued
                reused: false
        "400":
          description: "Invalid TOR id. Code `INVALID_TOR_ID`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "Authentication required. Code `UNAUTHORIZED`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403": { $ref: '#/components/responses/Forbidden' }
        "404":
          description: "TOR not found. Code `TOR_NOT_FOUND`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "TOR has no extracted facts to draft from. Code `TOR_NOT_EXTRACTED`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: "This user exceeded the proposal draft limit (default 5 per hour). Code `PROPOSAL_DRAFT_RATE_LIMITED`."
          headers:
            Retry-After:
              description: Seconds until the caller can queue another draft
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: "Failed to queue the proposal draft. Code `PROPOSAL_DRAFT_ENQUEUE_FAILED`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    get:
      summary: Read the caller's proposal draft job
      description: >
        Requires `profile:read`.
        Returns status for a job this signed-in user queued for this TOR.
        Another user's job is not revealed. A completed job includes the
        sanitized draft, the AI-draft warning, and the model and prompt version.
      tags: [Bid Preparation]
      operationId: getProposalDraft
      security: [{ sessionAuth: [] }, { scopedJwtBearer: [] }]
      parameters:
        - $ref: "#/components/parameters/TorIdParam"
        - name: jobId
          in: query
          required: true
          schema:
            type: string
            pattern: "^[a-fA-F0-9]{24}$"
          example: 6550f1b2d4e6a7c809123456
      responses:
        "200":
          description: Job status and, when finished, the sanitized draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposalDraftJob"
              example:
                jobId: 6550f1b2d4e6a7c809123456
                status: running
                error: null
        "400":
          description: "Invalid TOR id or job id. Codes `INVALID_TOR_ID`, `INVALID_JOB_ID`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "Authentication required. Code `UNAUTHORIZED`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403": { $ref: '#/components/responses/Forbidden' }
        "404":
          description: "No such draft for this caller and TOR. Code `PROPOSAL_DRAFT_NOT_FOUND`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: "Failed to read the proposal draft job. Code `PROPOSAL_DRAFT_READ_FAILED`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /admin/classification/queue:
    get:
      summary: List TORs with confidence strictly below 70 percent
      description: >
        Requires the admin role and `admin:read`. Scores use the 0..1 scale; 0.70 is excluded and missing
        scores are not treated as zero. By default either classification or the
        current primary TOR summary may qualify a record. Does not invoke OCR or AI.
      tags: [Admin - Classification]
      operationId: listClassificationQueue
      security:
        - sessionAuth: []
        - scopedJwtBearer: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000000, default: 1 }
        - $ref: "#/components/parameters/PageSizeParam"
        - name: confidenceType
          in: query
          schema: { type: string, enum: [either, classification, extraction], default: either }
      responses:
        "200":
          description: Stable paginated low-confidence records with explicit score/source provenance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LowConfidenceReviewPage"
        "401":
          description: "Missing, invalid or expired admin authentication. Code `UNAUTHORIZED`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "403":
          description: "Authenticated session is not an admin. Codes `INSUFFICIENT_SCOPE`, `FORBIDDEN_ORIGIN`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "400":
          description: "Invalid pagination or confidenceType. Code `INVALID_REVIEW_QUERY`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: "Failed to load the low-confidence queue. Code `LOW_CONFIDENCE_REVIEW_FAILED`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /admin/tors/{id}/classification:
    get:
      summary: List a TOR's classification override history
      description: "Returns up to 100 override history entries, newest first. Requires the admin role and admin:read scope."
      tags: [Admin - Classification]
      operationId: listTorClassificationOverrides
      security: [{ sessionAuth: [] }, { scopedJwtBearer: [] }]
      parameters:
        - $ref: "#/components/parameters/TorIdParam"
      responses:
        "200":
          description: Override history (up to 100 entries)
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ClassificationOverride"
        "400":
          description: "Missing TOR id. Code `INVALID_TOR_ID`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "500":
          description: "Failed to load classification override history. Code `CLASSIFICATION_HISTORY_FAILED`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    patch:
      summary: Manually override a TOR's classification and document status
      description: |
        Requires the admin role and tor:write scope. Browser requests require an allowed Origin.
        FR-1.2.2 / FR-1.2.3. Sets `classification.status` to `manual_override` (which keyword
        re-runs and ingestion never overwrite), force-assigns tags, and optionally overrides the
        processing or primary document status. The reviewer is recorded on the TOR and in the
        override history. When the id is still an unpublished discovery candidate (e.g. a
        low-confidence notice), `isSoftware: true` sends it back through open-bid verification
        and `isSoftware: false` rejects it; the response then has `target: candidate`.
      tags: [Admin - Classification]
      operationId: updateTorClassification
      security: [{ sessionAuth: [] }, { scopedJwtBearer: [] }]
      parameters:
        - $ref: "#/components/parameters/TorIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              anyOf:
                - required: [isSoftware]
                - required: [tags]
                - required: [processingStatus]
                - required: [documentStatus]
              properties:
                isSoftware:
                  type: boolean
                tags:
                  type: array
                  maxItems: 20
                  items: { type: string, minLength: 1, maxLength: 50 }
                processingStatus:
                  type: string
                  description: Processing status for a published TOR.
                  enum: [metadata_ingested, classification_pending, irrelevant, document_pending, document_downloaded, ai_pending, text_extraction_pending, text_extracted, completed, metadata_only, review_required, retry_pending, failed]
                documentStatus:
                  type: string
                  description: Primary document's processing status, returned as `documents.tor.status`.
                  enum: [downloaded, stored, text_ready, summarized, skipped, review_required, retry_pending, failed]
                reason:
                  type: string
                  maxLength: 500
                enqueueProcessing:
                  type: boolean
                  default: false
                  description: Queue OCR/AI processing when the TOR ends up classified as software.
      responses:
        "200":
          description: Updated TOR, or the updated discovery candidate
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/TorDetail"
                  - type: object
                    required: [id, target, status, classification]
                    properties:
                      id: { type: string }
                      target: { type: string, enum: [candidate] }
                      status: { type: string }
                      classification: { type: object }
        "400":
          description: "Invalid override body. Codes `INVALID_TOR_ID`, `INVALID_BODY`, `INVALID_OVERRIDE`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404":
          description: "TOR not found. Code `TOR_NOT_FOUND`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "Document status requested but the TOR has no stored document, or the id is an unpublished candidate. Codes `NO_DOCUMENT`, `NOT_PUBLISHED`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: "Failed to save the classification override. Code `CLASSIFICATION_OVERRIDE_FAILED`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /admin/keywords:
    get:
      summary: List classification keyword rules
      description: "Requires the admin role and admin:read scope."
      tags: [Admin - Classification]
      operationId: listClassificationKeywords
      security: [{ sessionAuth: [] }, { scopedJwtBearer: [] }]
      responses:
        "200":
          description: All keyword rules used by the classifier
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClassificationKeyword"
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "500":
          description: "Failed to list classification keywords. Code `LIST_KEYWORDS_FAILED`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    put:
      summary: Replace the classification keyword list
      description: "Requires the admin role and admin:write scope. Browser requests require an allowed Origin."
      tags: [Admin - Classification]
      operationId: replaceClassificationKeywords
      security: [{ sessionAuth: [] }, { scopedJwtBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                required: [keyword, category]
                properties:
                  keyword:
                    type: string
                  category:
                    $ref: "#/components/schemas/KeywordCategory"
      responses:
        "200":
          description: Updated keyword list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClassificationKeyword"
        "400":
          description: "Invalid keyword list (e.g. empty keyword string). Codes `INVALID_BODY`, `EMPTY_KEYWORD`, `BAD_CATEGORY`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "500":
          description: "Failed to replace classification keywords. Code `REPLACE_KEYWORDS_FAILED`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ---------------------------------------------------------------------------
  # Current - PDF parsing / summarization (FR-2.1)
  # ---------------------------------------------------------------------------
  /tors/{id}/summary:
    get:
      summary: Get the LLM-extracted structured summary for a TOR
      description: Returns extraction fields even when processing is pending.
        In that case summary is null and list fields are empty arrays.
      tags: [PDF Summary]
      operationId: getTorSummary
      parameters:
        - $ref: "#/components/parameters/TorIdParam"
      responses:
        "200":
          description: Structured summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TorApiSummary"
        "400":
          description: "Missing TOR id. Code `INVALID_TOR_ID`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404":
          description: "TOR not found. Code `TOR_NOT_FOUND`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429": { $ref: '#/components/responses/RateLimited' }
        "500":
          description: "Failed to load TOR summary. Code `GET_TOR_SUMMARY_FAILED`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ---------------------------------------------------------------------------
  # Auth (supports FR-2.2, FR-2.3)
  # ---------------------------------------------------------------------------
  /auth/google/start:
    get:
      summary: Start Google OAuth sign-in
      description: Sets a short-lived state cookie and redirects to Google. Limited to 5 requests per IP per 15-minute fixed window; shares its budget with /auth/google/login.
      tags: [Auth]
      operationId: startGoogleOAuth
      parameters:
        - $ref: '#/components/parameters/OAuthNextParam'
      responses:
        "200":
          description: When Accept is application/json, returns the Google authorization URL for browser navigation; sets the same state cookie and counts one attempt.
          headers:
            Set-Cookie: { $ref: '#/components/headers/OAuthStateCookie' }
          content:
            application/json:
              schema:
                type: object
                required: [authorizationUrl]
                properties:
                  authorizationUrl: { type: string, format: uri }
        "307":
          description: Redirect to Google consent screen
          headers:
            Location: { $ref: '#/components/headers/GoogleConsentLocation' }
            Set-Cookie: { $ref: '#/components/headers/OAuthStateCookie' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "429":
          description: "OAuth attempt limit exceeded. Code `RATE_LIMITED`."
          headers:
            Retry-After:
              schema: { type: integer, minimum: 1 }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
            text/html:
              schema: { type: string }

  /auth/google/callback:
    get:
      summary: Complete Google OAuth sign-in
      description: Validates the state cookie, exchanges the code, and creates a session. Limited to 5 requests per IP per 15-minute fixed window, independently of the start budget. Invalid state and rate-limited attempts are audited without recording OAuth secrets.
      tags: [Auth]
      operationId: completeGoogleOAuth
      parameters:
        - name: code
          in: query
          required: true
          schema: { type: string, minLength: 1 }
        - name: state
          in: query
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "307":
          description: Session established; redirect to validated destination
          headers:
            Location:
              schema: { type: string, format: uri }
            Set-Cookie:
              description: OAuth state or session cookie for the redirect.
              schema: { type: string }
        "400":
          description: "Missing code, invalid state, or Google verification failure"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageError' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403":
          description: "Account disabled or disallowed Origin. Code `FORBIDDEN_ORIGIN`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthenticationError' }
        "409":
          description: "Existing account uses a different sign-in method"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageError' }
        "500":
          description: "Authentication processing failed"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageError' }
        "429":
          description: "OAuth attempt limit exceeded. Code `RATE_LIMITED`."
          headers:
            Retry-After:
              schema: { type: integer, minimum: 1 }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
            text/html:
              schema: { type: string }

  /auth/google/login:
    get:
      summary: Start Google OAuth sign-in
      description: Compatibility alias for /auth/google/start. Shares its limit of 5 requests per IP per 15-minute fixed window.
      tags: [Auth]
      operationId: loginWithGoogle
      parameters:
        - $ref: '#/components/parameters/OAuthNextParam'
      responses:
        "200":
          description: "Authorization URL for JSON clients"
          headers:
            Set-Cookie: { $ref: '#/components/headers/OAuthStateCookie' }
          content:
            application/json:
              schema:
                type: object
                required: [authorizationUrl]
                properties:
                  authorizationUrl: { type: string, format: uri }
        "307":
          description: Redirect to Google consent screen
          headers:
            Location: { $ref: '#/components/headers/GoogleConsentLocation' }
            Set-Cookie: { $ref: '#/components/headers/OAuthStateCookie' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "429":
          description: "OAuth attempt limit exceeded. Code `RATE_LIMITED`."
          headers:
            Retry-After:
              schema: { type: integer, minimum: 1 }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
            text/html:
              schema: { type: string }

  /auth/register:
    post:
      summary: Create an email/password account and sign in immediately
      description: Requires an approved Origin. Creates only a normal user. Stores a salted scrypt hash; existing Google/password accounts cannot be overwritten or automatically linked. Local version does not verify email ownership.
      tags: [Auth]
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                name: { type: string, maxLength: 100, description: Optional; not requested by the sign-up page }
                email: { type: string, format: email, maxLength: 254 }
                username: { type: string, minLength: 3, maxLength: 30, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{1,28}[A-Za-z0-9]$', description: "Optional. Stored lowercase; unique. Derived from the email when omitted. Reserved names such as admin are rejected." }
                password: { type: string, format: password, minLength: 15, maxLength: 128, writeOnly: true, description: "15–128 Unicode code points and at most 512 UTF-8 bytes." }
                next: { type: string, description: Same-origin path; unsafe values fall back to /dashboard }
      responses:
        "201":
          description: User created; sets HttpOnly mtn_session cookie
          headers:
            Set-Cookie:
              description: HTTP-only mtn_session cookie.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PasswordAuthResult" }
        "400":
          description: "Invalid email, name, username, password or JSON. Codes `INVALID_REQUEST`, `INVALID_CREDENTIALS`, `INVALID_NAME`, `INVALID_USERNAME`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403":
          description: "Missing or disallowed browser Origin. Code `FORBIDDEN_ORIGIN`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "409":
          description: "Account already exists (original login method must be used) or the requested username is taken (error.code USERNAME_TAKEN). Code `ACCOUNT_EXISTS`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "413":
          description: "JSON body exceeds 8 KiB. Code `INVALID_REQUEST`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "415":
          description: "Content-Type must be application/json. Code `INVALID_REQUEST`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "429": { $ref: '#/components/responses/RateLimited' }
        "503":
          description: "Authentication service unavailable or busy. Code `AUTH_UNAVAILABLE`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/login:
    post:
      summary: Log in with email or username + password
      description: Requires an approved Origin. `identifier` is an email (contains @) or a username; both are normalized. Missing, Google-only and wrong-password accounts receive the same 401 response. Rate limits are shared with registration, plus one attempt budget per account regardless of which identifier is used.
      tags: [Auth]
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              anyOf:
                - required: [identifier]
                - required: [email]
              properties:
                identifier:
                  type: string
                  maxLength: 254
                  description: Email address or username
                email:
                  type: string
                  format: email
                  description: Older alias of `identifier`; accepts the same values
                password:
                  type: string
                  format: password
                  minLength: 15
                  maxLength: 128
                  writeOnly: true
                  description: 15–128 Unicode code points and at most 512 UTF-8 bytes.
                next:
                  type: string
            example:
              identifier: example-bidder
              password: "example-password-only"
              next: /dashboard
      responses:
        "200":
          description: Session established (sets sessionAuth cookie)
          headers:
            Set-Cookie:
              description: HTTP-only mtn_session cookie.
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordAuthResult"
              example:
                user:
                  id: 6550f1b2d4e6a7c809123457
                  email: bidder@example.com
                  username: example-bidder
                  name: Example Bidder
                  role: user
                redirectTo: /dashboard
        "401":
          description: "Invalid credentials. Codes `UNAUTHORIZED`, `INVALID_CREDENTIALS`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: INVALID_CREDENTIALS
                  message: อีเมล/ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง หรือโปรดใช้ Google หากสมัครด้วย Google
        "400":
          description: "Invalid email, password or JSON. Codes `INVALID_REQUEST`, `INVALID_CREDENTIALS`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "403":
          description: "Missing or disallowed browser Origin. Code `FORBIDDEN_ORIGIN`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "413":
          description: "JSON body exceeds 8 KiB. Code `INVALID_REQUEST`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "415":
          description: "Content-Type must be application/json. Code `INVALID_REQUEST`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "429": { $ref: '#/components/responses/RateLimited' }
        "503":
          description: "Authentication service unavailable or busy. Code `AUTH_UNAVAILABLE`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/logout:
    post:
      summary: End the current session
      description: >
        Clears the session cookie for signed-in users and guests. Revokes the presented
        valid JWT in the current process and attempts to increment the account's session
        version to invalidate earlier sessions across instances. Process-local revocation
        remains active if the database write fails. Logout is audited with non-secret
        metadata. An allowed Origin is required for browser requests.
      tags: [Auth]
      operationId: logout
      security: []
      responses:
        "200":
          description: "Session cookie cleared"
          headers:
            Set-Cookie:
              description: Expires the session cookie.
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean, enum: [true] }
        "401":
          description: "Invalid explicit bearer credential. Code `UNAUTHORIZED`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "403":
          description: "Missing or disallowed Origin. Code `FORBIDDEN_ORIGIN`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/me:
    get:
      summary: Get the currently logged-in user
      description: "Requires `profile:read`."
      tags: [Auth]
      operationId: getCurrentUser
      security: [{ sessionAuth: [] }, { scopedJwtBearer: [] }]
      responses:
        "200":
          description: "Current user"
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    type: object
                    required: [id, email, name, companyName, picture, role]
                    properties:
                      id: { type: string }
                      email: { type: string, format: email }
                      name: { type: string, nullable: true }
                      companyName: { type: string, nullable: true }
                      picture: { type: string, nullable: true }
                      role: { type: string, enum: [user, admin] }
        "401":
          description: "Authentication required, session invalid, or account no longer exists. Code `UNAUTHORIZED`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthenticationError' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "500":
          description: "Failed to load the current user"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageError' }

  # ---------------------------------------------------------------------------
  # Current - Contractor Profile (FR-2.2)
  # ---------------------------------------------------------------------------
  /profile:
    get:
      summary: Read the authenticated user's company profile
      description: "Requires `profile:read`. Identity is session.sub (cookie or scoped Bearer); query user IDs are ignored. Legacy bid fields default to empty strings and an empty history."
      tags: [Contractor Profile]
      operationId: getProfile
      security: [{ sessionAuth: [] }, { scopedJwtBearer: [] }]
      responses:
        "200":
          description: Current profile with no googleId or passwordHash
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompanyProfileResponse" }
        "401":
          description: "Authentication required or session invalid. Code `UNAUTHORIZED`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthenticationError' }
        "403":
          description: "Missing profile read permission. Codes `INSUFFICIENT_SCOPE`, `FORBIDDEN_ORIGIN`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "404":
          description: "User not found"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageError' }
        "429": { $ref: '#/components/responses/RateLimited' }
        "500":
          description: "Failed to complete the profile request"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageError' }
    put:
      summary: Update the authenticated user's company profile
      description: "Requires `profile:write`. Partial updates. Unknown fields including role, passwordHash and user IDs are ignored. Strings are trimmed. Replace past_projects with the edited array to remove rows; an empty array clears it. Years are Buddhist Era 2400–2700. Maximum JSON body is 128 KiB. Cookie writes require an approved Origin."
      tags: [Contractor Profile]
      operationId: updateProfile
      security: [{ sessionAuth: [] }, { scopedJwtBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompanyProfileUpdate" }
      responses:
        "200":
          description: Saved profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompanyProfileResponse" }
        "400":
          description: "Malformed JSON, invalid request body or invalid profile fields. Codes `INVALID_JSON`, `INVALID_BODY`, `INVALID_PROFILE`."
          content:
            application/json:
              schema:
                anyOf:
                  - { $ref: '#/components/schemas/Error' }
                  - { $ref: '#/components/schemas/ProfileValidationError' }
        "401":
          description: "Authentication required or session invalid. Code `UNAUTHORIZED`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthenticationError' }
        "403":
          description: "Missing profile write permission or invalid Origin. Codes `INSUFFICIENT_SCOPE`, `FORBIDDEN_ORIGIN`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "404":
          description: "User not found"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageError' }
        "413":
          description: "JSON body exceeds 128 KiB. Code `PAYLOAD_TOO_LARGE`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "415":
          description: "Content-Type must be application/json. Code `UNSUPPORTED_MEDIA_TYPE`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "429": { $ref: '#/components/responses/RateLimited' }
        "500":
          description: "Failed to complete the profile request. Code `PROFILE_UPDATE_FAILED`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    patch:
      summary: Partially update the authenticated user's company profile
      description: "Requires `profile:write`. Alias for PATCH /profiles with the same validation and ownership rules."
      tags: [Contractor Profile]
      operationId: patchProfileAlias
      security: [{ sessionAuth: [] }, { scopedJwtBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompanyProfileUpdate" }
      responses:
        "200":
          description: Saved profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompanyProfileResponse" }
        "400":
          description: "Malformed JSON, invalid request body or invalid profile fields. Codes `INVALID_JSON`, `INVALID_BODY`, `INVALID_PROFILE`."
          content:
            application/json:
              schema:
                anyOf:
                  - { $ref: '#/components/schemas/Error' }
                  - { $ref: '#/components/schemas/ProfileValidationError' }
        "401":
          description: "Authentication required or session invalid. Code `UNAUTHORIZED`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthenticationError' }
        "403":
          description: "Missing profile write permission or invalid Origin. Codes `INSUFFICIENT_SCOPE`, `FORBIDDEN_ORIGIN`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "404":
          description: "User not found"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageError' }
        "413":
          description: "JSON body exceeds 128 KiB. Code `PAYLOAD_TOO_LARGE`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "415":
          description: "Content-Type must be application/json. Code `UNSUPPORTED_MEDIA_TYPE`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "429": { $ref: '#/components/responses/RateLimited' }
        "500":
          description: "Failed to complete the profile request. Code `PROFILE_UPDATE_FAILED`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      summary: Delete the signed-in user's account and owned drafts
      description: "Requires `profile:write`."
      tags: [Contractor Profile]
      operationId: deleteProfileAlias
      security: [{ sessionAuth: [] }, { scopedJwtBearer: [] }]
      responses:
        "200":
          description: "Account and owned drafts deleted"
          content:
            application/json:
              schema:
                type: object
                required: [status, message]
                properties:
                  status: { type: string, enum: [success] }
                  message: { type: string }
        "401":
