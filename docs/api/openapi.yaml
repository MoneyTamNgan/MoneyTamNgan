      operationId: getIngestionStatus
      security: [{ sessionAuth: [] }, { scopedJwtBearer: [] }, { pipelineBearer: [] }]
      responses:
        "200":
          description: "Ingestion status and recent runs"
          content:
            application/json:
              schema:
                type: object
                required: [status, totalProjects, candidates, pendingCandidates, lastIngestedAt, lastProjectId, schedule, lastRun, recentRuns]
                properties:
                  status: { type: string, enum: [ok] }
                  totalProjects: { type: integer }
                  candidates: { type: object, additionalProperties: { type: integer } }
                  pendingCandidates: { type: array, items: { type: object, additionalProperties: true } }
                  lastIngestedAt: { type: string, format: date-time, nullable: true }
                  lastProjectId: { type: string, nullable: true }
                  schedule:
                    oneOf:
                    - type: object
                      required: [spec, timeZone, nextRunAt]
                      properties:
                        spec: { type: string }
                        timeZone: { type: string }
                        nextRunAt: { type: string, format: date-time }
                    - type: object
                      required: [error]
                      properties:
                        error: { type: string }
                  lastRun: { type: object, nullable: true, additionalProperties: true }
                  recentRuns: { type: array, items: { type: object, additionalProperties: true } }
        "401":
          description: "Authentication required. Code `UNAUTHORIZED`."
