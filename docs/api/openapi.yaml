openapi: 3.0.3
info:
  title: MoneyTamNgan API
  description: >
    JSON REST API contract between the Next.js frontend and the Node.js backend,
    covering the full system so FE/BE only need to design this once.

    Endpoints are tagged by status (see each tag's description). "Current"
    endpoints are the committed, build-now target (TOR ingestion + software/
    non-software classification, FR-1.1/FR-1.2); everything else is a
    forward-looking draft that MAY change once its requirements are worked
    out in detail — treat it as a starting point for later contract review,
    not a frozen spec.
  version: "0.2.0-draft"
  license:
    name: UNLICENSED
servers:
  - url: http://localhost:4000/api/v1
    description: Local development (backend port TBD by BE dev)

security: []

tags:
  - name: TORs
    description: "[Current] Public/shared endpoints for reading ingested TOR records (FR-1.1, FR-1.2)."
  - name: Admin - Ingestion
    description: "[Current] Monitoring and manual triggering of scraping jobs (FR-1.1)."
  - name: Admin - Classification
    description: "[Current] Reviewing and correcting software/non-software classification (FR-1.2)."
  - name: Auth
    description: "[Planned] Login/session, required by Contractor Profile and Matching below (supports FR-2.2/2.3)."
  - name: Contractor Profile
    description: "[Planned] Self-reported contractor profile CRUD (FR-2.2)."
  - name: Matching
    description: "[Planned] Match scoring between TORs and contractor profiles (FR-2.3)."
  - name: PDF Summary
    description: "[Planned] OCR/LLM-extracted structured summary fields on a TOR (FR-2.1)."
  - name: Anomaly Detection
    description: "[Planned] Budget and qualification anomaly flags on a TOR (FR-3.1, FR-3.2)."
  - name: Public Analytics
    description: "[Current] Public historical search, dashboard aggregates, and export for the Analytics page."

paths:
  # ---------------------------------------------------------------------------
  # Current - build now
  # ---------------------------------------------------------------------------
  /health:
    get:
      summary: Liveness check
      description: Basic health check for FE integration smoke-testing.
      operationId: getHealth
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok

  /tors:
    get:
      summary: List/filter ingested TORs
      tags: [TORs]
      operationId: listTors
      parameters:
        - name: isSoftware
          in: query
          description: Filter by classification result. Omit to include all (including pending/null).
          schema:
            type: boolean
        - name: agency
          in: query
          description: Filter by exact issuing agency name.
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: stage
          in: query
          description: Temporary TOR stage derived from contractStart.
          schema:
            type: string
            enum: [draft, official, review, closed]
        - name: biddingStatus
          in: query
          description: Live bidding status calculated from the exact submission deadline. Use unknown for every project without a usable deadline, including cancelled projects.
          schema:
            type: string
            enum: [open, closed, unknown]
        - name: dateFrom
          in: query
          description: Inclusive lower bound on releaseDate (ISO 8601 date).
          schema:
            type: string
            format: date
        - name: dateTo
          in: query
          description: Inclusive upper bound on releaseDate (ISO 8601 date).
          schema:
            type: string
            format: date
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
      responses:
        "200":
          description: Paginated list of TORs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TorListResponse"
              example:
                status: success
                page: 1
                limit: 10
                total: 186
                data:
                  - id: "TOR-2569-014"
                    title: "ระบบบริหารจัดการจราจรอัจฉริยะ"
                    agency: "สำนักการจราจรและขนส่ง"
                    budget: 15000000
                    projectStatus: "ระหว่างดำเนินการ"
                    bidding:
                      status: open
                      opensAt: "2026-10-12T02:00:00.000Z"
                      closesAt: "2026-10-12T05:00:00.000Z"
                      submissionDate: "2026-10-12"
                      submissionStartTime: "09:00"
                      submissionEndTime: "12:00"
                      invitationUrl: "https://process5.gprocurement.go.th/invitation.pdf"
                      method: "ประกวดราคาอิเล็กทรอนิกส์ (e-bidding)"
                    announceDate: "2026-08-09T00:00:00.000Z"
                    contractStart: null
                    contractEnd: null
                    isSoftware: true
                    classification: { status: software, confidence: 0.92 }
                    documentStatus: pending
                    processingStatus: ai_pending
                    techStack: [React, Node.js, Cloud]
                    anomaly: { highBudgetFlag: false, budgetDeviationMultiplier: 1 }
        "400":
          description: Invalid filter parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /tors/facets:
    get:
      summary: List dashboard TOR filter facets
      tags: [TORs]
      operationId: listTorFacets
      parameters:
        - name: isSoftware
          in: query
          description: Restrict facet values and total to software or non-software TORs.
          schema: { type: boolean }
      responses:
        "200":
          description: Complete deduplicated agency list, independent of list pagination.
          content:
            application/json:
              schema:
                type: object
                required: [status, total, agencies]
                properties:
                  status: { type: string, enum: [success] }
                  total: { type: integer, minimum: 0 }
                  agencies:
                    type: array
                    items:
                      type: object
                      required: [name, count]
                      properties:
                        name: { type: string }
                        count: { type: integer, minimum: 1 }

  /tors/{id}:
    get:
      summary: Get a single TOR by id
      tags: [TORs]
      operationId: getTor
      parameters:
        - $ref: "#/components/parameters/TorIdParam"
      responses:
        "200":
          description: TOR detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TorDetail"
        "404":
          description: TOR not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /admin/ingestion/runs:
    get:
      summary: List recent ingestion job runs
      description: Backs the admin "ingestion overview" panel (source, status, item counts).
      tags: [Admin - Ingestion]
      operationId: listIngestionRuns
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
      responses:
        "200":
          description: Paginated list of ingestion runs, most recent first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedList"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/IngestionRun"
        "400":
          description: Invalid pagination parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: Manually trigger an ingestion job
      description: >
        Backs the "สั่งการดึงข้อมูลด้วยตนเอง" (trigger ingestion manually) button
        in the admin mockup.
      tags: [Admin - Ingestion]
      operationId: triggerIngestionRun
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                source:
                  type: string
                  description: Optional single source to run (e.g. "BMA Procurement Portal", "e-GP"). Omit to run all configured sources.
      responses:
        "202":
          description: Ingestion job accepted and started asynchronously
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestionRun"
        "409":
          description: An ingestion run is already in progress for the requested source
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /admin/classification/queue:
    servers:
      - url: http://localhost:3000/api
    get:
      summary: List TORs with confidence strictly below 70 percent
      description: >
        Admin-only read. Scores use the 0..1 scale; 0.70 is excluded and missing
        scores are not treated as zero. By default either classification or the
        current primary TOR summary may qualify a record. Does not invoke OCR or AI.
      tags: [Admin - Classification]
      operationId: listClassificationQueue
      security:
        - sessionAuth: []
        - pipelineBearer: []
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
        - name: confidenceType
          in: query
          schema: { type: string, enum: [either, classification, extraction], default: either }
      responses:
        "200":
          description: Stable paginated low-confidence records with explicit score/source provenance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LowConfidenceReviewPage"
        "401":
          description: Missing, invalid or expired admin authentication
        "403":
          description: Authenticated session is not an admin
        "400":
          description: Invalid pagination parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /admin/tors/{id}/classification:
    get:
      summary: List a TOR's classification override history
      description: Audit log of admin overrides with the reviewer who made each one, newest first.
      tags: [Admin - Classification]
      operationId: listTorClassificationOverrides
      parameters:
        - $ref: "#/components/parameters/TorIdParam"
      responses:
        "200":
          description: Override history (up to 100 entries)
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ClassificationOverride"
        "400":
          description: Missing TOR id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      summary: Manually override a TOR's classification and document status
      description: |
        FR-1.2.2 / FR-1.2.3. Sets `classification.status` to `manual_override` (which keyword
        re-runs and ingestion never overwrite), force-assigns tags, and optionally overrides the
        processing or primary document status. The reviewer is recorded on the TOR and in the
        override history. When the id is still an unpublished discovery candidate (e.g. a
        low-confidence notice), `isSoftware: true` sends it back through open-bid verification
        and `isSoftware: false` rejects it; the response then has `target: candidate`.
      tags: [Admin - Classification]
      operationId: updateTorClassification
      parameters:
        - $ref: "#/components/parameters/TorIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                isSoftware:
                  type: boolean
                tags:
                  type: array
                  maxItems: 20
                  items: { type: string, minLength: 1, maxLength: 50 }
                processingStatus:
                  type: string
                  description: Project processing status, e.g. review_required or document_pending.
                documentStatus:
                  type: string
                  description: Primary document's processing status, returned as `documents.tor.status`.
                  enum: [downloaded, stored, text_ready, summarized, skipped, review_required, retry_pending, failed]
                reason:
                  type: string
                  maxLength: 500
                enqueueProcessing:
                  type: boolean
                  default: false
                  description: Queue OCR/AI processing when the TOR ends up classified as software.
      responses:
        "200":
          description: Updated TOR, or the updated discovery candidate
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/TorDetail"
                  - type: object
                    required: [id, target, status, classification]
                    properties:
                      id: { type: string }
                      target: { type: string, enum: [candidate] }
                      status: { type: string }
                      classification: { type: object }
        "400":
          description: Invalid override body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: TOR not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Document status requested but the TOR has no stored document, or the id is an unpublished candidate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /admin/keywords:
    get:
      summary: List classification keyword rules
      tags: [Admin - Classification]
      operationId: listClassificationKeywords
      responses:
        "200":
          description: All keyword rules used by the classifier
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClassificationKeyword"
    put:
      summary: Replace the classification keyword list
      description: Backs the admin toggle for updating software-classification keywords.
      tags: [Admin - Classification]
      operationId: replaceClassificationKeywords
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                required: [keyword, category]
                properties:
                  keyword:
                    type: string
                  category:
                    $ref: "#/components/schemas/KeywordCategory"
      responses:
        "200":
          description: Updated keyword list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClassificationKeyword"
        "400":
          description: Invalid keyword list (e.g. empty keyword string)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ---------------------------------------------------------------------------
  # Current - PDF parsing / summarization (FR-2.1)
  # ---------------------------------------------------------------------------
  /tors/{id}/summary:
    get:
      summary: Get the LLM-extracted structured summary for a TOR
      description: Returns extraction fields even when processing is pending.
        In that case summary is null and list fields are empty arrays.
      tags: [PDF Summary]
      operationId: getTorSummary
      parameters:
        - $ref: "#/components/parameters/TorIdParam"
      responses:
        "200":
          description: Structured summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TorApiSummary"
        "404":
          description: TOR not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ---------------------------------------------------------------------------
  # Planned - Auth (supports FR-2.2, FR-2.3)
  # ---------------------------------------------------------------------------
  /auth/google:
    post:
      summary: Log in with a Google ID token
      description: Planned, matches the mockup's "เข้าสู่ระบบด้วย Google" button.
      tags: [Auth]
      operationId: loginWithGoogle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idToken]
              properties:
                idToken:
                  type: string
                  description: Google Sign-In ID token from the frontend.
      responses:
        "200":
          description: Session established (sets sessionAuth cookie)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Invalid Google token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/login:
    post:
      summary: Log in with email + password
      tags: [Auth]
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        "200":
          description: Session established (sets sessionAuth cookie)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/logout:
    post:
      summary: End the current session
      tags: [Auth]
      operationId: logout
      security: [{ sessionAuth: [] }]
      responses:
        "204":
          description: Logged out
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/me:
    get:
      summary: Get the currently logged-in user
      tags: [Auth]
      operationId: getCurrentUser
      security: [{ sessionAuth: [] }]
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ---------------------------------------------------------------------------
  # Planned - Contractor Profile (FR-2.2)
  # ---------------------------------------------------------------------------
  /profile:
    get:
      summary: Get the current user's contractor profile
      tags: [Contractor Profile]
      operationId: getProfile
      security: [{ sessionAuth: [] }]
      responses:
        "200":
          description: Contractor profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractorProfile"
        "404":
          description: Profile not created yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: Create the current user's contractor profile
      tags: [Contractor Profile]
      operationId: createProfile
      security: [{ sessionAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContractorProfileInput"
      responses:
        "201":
          description: Profile created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractorProfile"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      summary: Update the current user's contractor profile
      description: Per FR-2.2.3 - users may update their profile at any time.
      tags: [Contractor Profile]
      operationId: updateProfile
      security: [{ sessionAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContractorProfileInput"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractorProfile"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ---------------------------------------------------------------------------
  # Planned - Matching (FR-2.3)
  # ---------------------------------------------------------------------------
  /matches:
    get:
      summary: List TORs matching the current user's profile above their threshold
      tags: [Matching]
      operationId: listMatches
      security: [{ sessionAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
      responses:
        "200":
          description: Paginated list of matched TORs
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedList"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/MatchResult"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /tors/{id}/match:
    get:
      summary: Get the match score between one TOR and the current user's profile
      tags: [Matching]
      operationId: getTorMatch
      security: [{ sessionAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/TorIdParam"
      responses:
        "200":
          description: Match result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchResult"
        "404":
          description: TOR not found, or no profile exists to match against
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ---------------------------------------------------------------------------
  # Current - Anomaly Detection (FR-3.1, FR-3.2)
  # ---------------------------------------------------------------------------
  /tors/{id}/anomalies:
    get:
      summary: Get budget and qualification anomaly flags for a TOR
      description: Backs the clause-level highlight UI and budget warning badge.
      tags: [Anomaly Detection]
      operationId: getTorAnomalies
      parameters:
        - $ref: "#/components/parameters/TorIdParam"
      responses:
        "200":
          description: Anomaly detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TorApiAnomalyReport"
        "404":
          description: TOR not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /tors/{id}/report:
    post:
      summary: User-submitted flag report on a TOR
      description: Backs the "user flag reporting button" component.
      tags: [Anomaly Detection]
      operationId: reportTor
      parameters:
        - $ref: "#/components/parameters/TorIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
      responses:
        "201":
          description: Report submitted
        "404":
          description: TOR not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ---------------------------------------------------------------------------
  # Public Analytics (FR-4.1, FR-4.2)
  # ---------------------------------------------------------------------------
  /analytics/overview:
    get:
      summary: Search and aggregate the live TOR analytics catalog
      tags: [Public Analytics]
      operationId: analyticsOverview
      description: >
        Returns de-duplicated projects, dashboard metrics, chart series, and
        complete filter facets for projects with tender metadata. Bidding availability
        uses the exact submission deadline; fiscal years prefer confirmed document extraction.
        Ambiguous document years are excluded from year grouping, and missing years
        use a labeled estimate from the deadline in Asia/Bangkok.
      parameters:
        - name: isSoftware
          in: query
          schema: { type: boolean }
        - name: dateFrom
          in: query
          schema:
            type: string
            format: date
        - name: dateTo
          in: query
          schema:
            type: string
            format: date
        - name: agency
          in: query
          schema:
            type: string
        - name: budgetMin
          in: query
          schema:
            type: number
        - name: budgetMax
          in: query
          schema:
            type: number
        - name: biddingStatus
          in: query
          schema:
            type: string
            enum: [open, closed, cancelled, unknown]
        - name: fiscalYear
          in: query
          description: Thai Buddhist Era fiscal year, confirmed extraction first, otherwise estimated from the bidding deadline.
          schema: { type: integer, minimum: 2400, maximum: 3000 }
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
      responses:
        "200":
          description: Search results with aggregate metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsSearchResponse"
        "400":
          description: Invalid filter parameters
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /analytics/overview/export:
    get:
      summary: Export historical search results as CSV or JSON
      tags: [Public Analytics]
      operationId: exportAnalyticsOverview
      description: Applies the same filters as GET /analytics/overview. Exports at most 10,000 records; X-Export-Truncated indicates additional matches.
      parameters:
        - name: format
          in: query
          required: true
          schema:
            type: string
            enum: [csv, json]
        - name: dateFrom
          in: query
          schema:
            type: string
            format: date
        - name: dateTo
          in: query
          schema:
            type: string
            format: date
        - name: agency
          in: query
          schema:
            type: string
        - name: isSoftware
          in: query
          schema: { type: boolean }
        - name: biddingStatus
          in: query
          schema: { type: string, enum: [open, closed, cancelled, unknown] }
        - name: fiscalYear
          in: query
          schema: { type: integer, minimum: 2400, maximum: 3000 }
      responses:
        "200":
          description: File contents
          content:
            text/csv:
              schema:
                type: string
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AnalyticsTorItem"
        "400":
          description: Invalid export format or filter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /analytics/search:
    get:
      summary: Search historical TOR records with aggregate spend metrics
      tags: [Public Analytics]
      operationId: searchAnalytics
      description: >
        Unauthenticated and rate-limited (FR-4.2.2, see 429). Aggregates cover
        every matching project, not just the returned page.
      parameters:
        - name: isSoftware
          in: query
          schema: { type: boolean }
        - name: dateFrom
          in: query
          description: Inclusive lower bound on announce date.
          schema: { type: string, format: date }
        - name: dateTo
          in: query
          description: Inclusive upper bound on announce date.
          schema: { type: string, format: date }
        - name: agency
          in: query
          description: Exact issuing agency name.
          schema: { type: string }
        - name: budgetMin
          in: query
          schema: { type: number, minimum: 0 }
        - name: budgetMax
          in: query
          schema: { type: number, minimum: 0 }
        - name: category
          in: query
          schema:
            $ref: "#/components/schemas/KeywordCategory"
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
      responses:
        "200":
          description: One page of matching TORs with aggregate metrics
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedList"
                  - type: object
                    required: [items, aggregates]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/TorListItem"
                      aggregates:
                        $ref: "#/components/schemas/AnalyticsAggregates"
        "400":
          description: Invalid filter parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /analytics/export:
    get:
      summary: Export matching TOR records as CSV or JSON
      tags: [Public Analytics]
      operationId: exportAnalytics
      description: >
        Unauthenticated and rate-limited. Downloads up to 10,000 rows as an
        attachment; the X-Export-Truncated header is "true" when more matched.
        CSV is UTF-8 with a BOM so Excel shows Thai text correctly.
      parameters:
        - name: format
          in: query
          required: true
          schema:
            type: string
            enum: [csv, json]
        - name: dateFrom
          in: query
          description: Inclusive lower bound on announce date.
          schema: { type: string, format: date }
        - name: dateTo
          in: query
          description: Inclusive upper bound on announce date.
          schema: { type: string, format: date }
        - name: agency
          in: query
          description: Exact issuing agency name.
          schema: { type: string }
        - name: budgetMin
          in: query
          schema: { type: number, minimum: 0 }
        - name: budgetMax
          in: query
          schema: { type: number, minimum: 0 }
        - name: category
          in: query
          schema:
            $ref: "#/components/schemas/KeywordCategory"
      responses:
        "200":
          description: File contents
          headers:
            X-Export-Truncated:
              schema: { type: string, enum: ["true", "false"] }
          content:
            text/csv:
              schema:
                type: string
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AnalyticsExportRow"
        "400":
          description: Invalid format or filter parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: mtn_session
      description: >
        Signed session cookie; admin endpoints additionally require role=admin.
    pipelineBearer:
      type: http
      scheme: bearer
      description: Operator token configured as PIPELINE_ADMIN_TOKEN (at least 32 characters).

  parameters:
    TorIdParam:
      name: id
      in: path
      required: true
      schema:
        type: string
      example: "TOR-2569-014"
    PageParam:
      name: page
      in: query
      description: 1-indexed page number. Defaults to 1.
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSizeParam:
      name: pageSize
      in: query
      description: Items per page. Defaults to 20, max 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    LimitParam:
      name: limit
      in: query
      description: Items per page. Defaults to 10, max 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10

  schemas:
    LowConfidenceReviewPage:
      type: object
      required: [items, total, page, pageSize, totalPages, threshold, confidenceType]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/LowConfidenceReviewItem" }
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1, maximum: 1000000 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        totalPages: { type: integer, minimum: 0 }
        threshold: { type: number, enum: [0.7] }
        confidenceType: { type: string, enum: [either, classification, extraction] }

    LowConfidenceReviewItem:
      type: object
      required: [projectId, projectTitle, issuingAgency, titleSource, agencySource,
        classificationTags, isSoftware, classificationStatus, confidenceScore,
        confidenceScores, reviewReasons, primaryPdfUrl, primaryDocumentUrl,
        primaryDocumentType, primaryPdfEntryName, processingStatus]
      properties:
        projectId: { type: string }
        projectTitle: { type: string, nullable: true }
        issuingAgency: { type: string, nullable: true }
        titleSource: { type: string, enum: [extracted, government_metadata] }
        agencySource: { type: string, enum: [extracted, government_metadata] }
        classificationTags: { type: array, items: { type: string } }
        isSoftware: { type: boolean, nullable: true }
        classificationStatus: { type: string }
        confidenceScore:
          type: number
          minimum: 0
          maximum: 0.7
          description: Selected confidence on the 0..1 scale, strictly less than 0.70.
        confidenceScores:
          type: object
          required: [classification, extraction]
          properties:
            classification: { type: number, nullable: true, minimum: 0, maximum: 1 }
            extraction: { type: number, nullable: true, minimum: 0, maximum: 1 }
        reviewReasons: { type: array, items: { type: string, enum: [low_classification_confidence, low_extraction_confidence] } }
        primaryPdfUrl: { type: string, nullable: true, format: uri }
        primaryDocumentUrl: { type: string, nullable: true, format: uri }
        primaryDocumentType: { type: string, nullable: true, enum: [pdf, archive] }
        primaryPdfEntryName: { type: string, nullable: true }
        processingStatus: { type: string, nullable: true }

    TorStatus:
      type: string
      enum: [Active, Superseded, Invalid, Cancelled]

    KeywordCategory:
      type: string
      enum: [software, non-software]

    Tor:
      type: object
      required:
        - id
        - title
        - agency
        - budget
        - releaseDate
        - sourceUrl
        - status
        - isSoftware
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          description: Unique project id or URL-hash-derived identifier (FR-1.1.3 dedup key).
        title:
          type: string
        agency:
          type: string
          description: Issuing BMA agency name.
        budget:
          type: number
          description: Announced budget in THB.
        releaseDate:
          type: string
          format: date
        sourceUrl:
          type: string
          format: uri
        pdfUrl:
          type: string
          format: uri
          nullable: true
        status:
          $ref: "#/components/schemas/TorStatus"
        isSoftware:
          type: boolean
          nullable: true
          description: null = not yet classified.
        classificationConfidence:
          type: number
          nullable: true
          minimum: 0
          maximum: 1
          description: Classifier confidence score, null if not yet classified or manually overridden.
        supersededByTorId:
          type: string
          nullable: true
          description: "[Planned, FR-1.3] Id of the newer revision, if this record's status is Superseded."
        matchScore:
          type: number
          nullable: true
          minimum: 0
          maximum: 100
          description: "[Planned] Populated only when returned via an authenticated endpoint for a contractor with a profile."
        budgetAnomaly:
          type: object
          nullable: true
          description: "[Planned]"
          allOf:
            - $ref: "#/components/schemas/BudgetAnomaly"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ClassificationOverride:
      type: object
      required: [id, target, reviewer, reason, before, after, createdAt]
      properties:
        id: { type: string }
        target: { type: string, enum: [project, candidate] }
        reviewer:
          type: object
          required: [userId, email, via]
          properties:
            userId: { type: string, nullable: true }
            email: { type: string, nullable: true }
            via: { type: string, enum: [admin_session, pipeline_token] }
        reason: { type: string, nullable: true }
        before: { type: object }
        after: { type: object }
        createdAt: { type: string, format: date-time }

    TorApiClassification:
      type: object
      required: [status, confidence]
      properties:
        status:
          type: string
          nullable: true
          enum: [pending, software, not_software, uncertain, manual_override]
        confidence:
          type: number
          nullable: true
          minimum: 0
          maximum: 1

    TorListItem:
      type: object
      required: [id, title, agency, budget, projectStatus, bidding, announceDate, contractStart, contractEnd, isSoftware, classification, documentStatus, processingStatus, techStack, anomaly]
      properties:
        fiscalBudget: { $ref: "#/components/schemas/TorFiscalBudget" }
        id: { type: string }
        title: { type: string }
        agency: { type: string }
        budget: { type: number, nullable: true, description: "Announced budget in THB. Falls back to tender reference price when available." }
        projectStatus: { type: string }
        bidding:
          $ref: "#/components/schemas/TorApiBidding"
        announceDate: { type: string, format: date-time, nullable: true }
        contractStart: { type: string, format: date-time, nullable: true, description: "Contract start; currently used only by the temporary TOR-stage display." }
        contractEnd: { type: string, format: date-time, nullable: true, description: "Contract end, not a bidding deadline." }
        isSoftware: { type: boolean, nullable: true }
        classification:
          $ref: "#/components/schemas/TorApiClassification"
        documentStatus: { type: string, nullable: true }
        processingStatus: { type: string, nullable: true }
        techStack:
          type: array
          items: { type: string }
        anomaly:
          $ref: "#/components/schemas/TorListAnomaly"

    TorApiBidding:
      type: object
      required: [status, opensAt, closesAt, submissionDate, submissionStartTime, submissionEndTime, invitationUrl, method]
      properties:
        phase: { type: string, nullable: true, description: "Raw tender phase, separate from live bidding availability." }
        status: { type: string, enum: [open, closed, cancelled, unknown], description: "Calculated at response time from the bid-submission deadline; cancelled is retained from the source." }
        opensAt: { type: string, format: date-time, nullable: true, description: "Exact bid-submission session start in Asia/Bangkok." }
        closesAt: { type: string, format: date-time, nullable: true, description: "Exact bid-submission session end in Asia/Bangkok. The dashboard uses this as the live deadline." }
        submissionDate: { type: string, format: date, nullable: true }
        submissionStartTime: { type: string, nullable: true, example: "09:00" }
        submissionEndTime: { type: string, nullable: true, example: "12:00" }
        invitationUrl: { type: string, format: uri, nullable: true }
        method: { type: string, nullable: true }

    TorListAnomaly:
      type: object
      required: [highBudgetFlag, budgetDeviationMultiplier]
      properties:
        highBudgetFlag: { type: boolean }
        budgetDeviationMultiplier: { type: number }

    TorListResponse:
      type: object
      required: [status, page, limit, total, data]
      properties:
        status: { type: string, enum: [success] }
        page: { type: integer, minimum: 1 }
        limit: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }
        data:
          type: array
          items:
            $ref: "#/components/schemas/TorListItem"

    TorApiAnomaly:
      oneOf:
        - type: object
          required: [type, budgetDeviationMultiplier]
          properties:
            type: { type: string, enum: [high_budget] }
            budgetDeviationMultiplier: { type: number }
        - type: object
          required: [type, clauseText, reason, explanation]
          properties:
            type: { type: string, enum: [flagged_clause] }
            clauseText: { type: string }
            reason: { type: string }
            explanation: { type: string }
            highlightReason: { type: string }
            category:
              type: string
              enum: [unrealistic_tenure, excessive_hardware, vendor_lock_in]
            severity:
              type: string
              enum: [low, medium, high]
            page: { type: integer, minimum: 1 }
            confidence: { type: number, minimum: 0, maximum: 1 }

    TorFiscalBudget:
      type: object
      nullable: true
      required: [year, years, status, method, evidence]
      properties:
        warnings: { type: array, items: { type: string } }
        year: { type: integer, nullable: true, minimum: 2500, maximum: 2699 }
        years: { type: array, items: { type: integer, minimum: 2500, maximum: 2699 } }
        status: { type: string, enum: [found, not_found, ambiguous, document_unavailable] }
        source: { type: string, enum: [announcement, tor, combined] }
        needs_review: { type: boolean }
        method: { type: string, enum: [none, regex, llm, regex+llm] }
        evidence:
          type: array
          items:
            type: object
            required: [year, page, clause_text, section, method]
            properties:
              year: { type: integer, minimum: 2500, maximum: 2699 }
              page: { type: integer, minimum: 1 }
              clause_text: { type: string }
              section: { type: string, nullable: true }
              method: { type: string, enum: [regex, llm] }

    TorDocument:
      type: object
      nullable: true
      properties:
        id: { type: string, nullable: true }
        type: { type: string }
        filename: { type: string, nullable: true }
        sourceUrl: { type: string, nullable: true }
        mimeType: { type: string, nullable: true }
        sizeBytes: { type: number, nullable: true }
        status: { type: string, nullable: true }
        version: { type: number, nullable: true }
        isCurrentPrimary: { type: boolean }

    TorDetail:
      type: object
      required: [id, title, agency, budget, projectStatus, pdfUrl, createdAt, updatedAt, timeline, classification, documentStatus, processingStatus, requirements, scopeOfWork, techStack, summary, anomalies, version]
      properties:
        bidding: { $ref: "#/components/schemas/TorApiBidding" }
        documents:
          type: object
          properties:
            tor: { $ref: "#/components/schemas/TorDocument" }
            announcement: { $ref: "#/components/schemas/TorDocument" }
        id: { type: string }
        title: { type: string }
        agency:
          type: object
          required: [name, subName]
          properties:
            name: { type: string }
            subName: { type: string, nullable: true }
        budget: { type: number, nullable: true }
        projectStatus: { type: string }
        pdfUrl: { type: string, format: uri, nullable: true }
        createdAt: { type: string, format: date-time, nullable: true }
        updatedAt: { type: string, format: date-time, nullable: true }
        timeline:
          type: object
          required: [announceDate, contractStart, contractEnd, durationDays]
          properties:
            announceDate: { type: string, format: date-time, nullable: true }
            contractStart: { type: string, format: date-time, nullable: true }
            contractEnd: { type: string, format: date-time, nullable: true }
            durationDays: { type: integer, nullable: true }
        classification:
          allOf:
            - $ref: "#/components/schemas/TorApiClassification"
            - type: object
              required: [isSoftware, reason]
              properties:
                isSoftware: { type: boolean, nullable: true }
                reason: { type: string, nullable: true }
                tags:
                  type: array
                  items: { type: string }
                  description: Admin-assigned tags (FR-1.2.2).
                reviewedBy:
                  type: object
                  nullable: true
                  description: Admin who last overrode the classification or document status. Only returned by the admin override endpoint.
                  required: [userId, email, via]
                  properties:
                    userId: { type: string, nullable: true }
                    email: { type: string, nullable: true }
                    via: { type: string, enum: [admin_session, pipeline_token] }
                reviewedAt: { type: string, format: date-time, nullable: true }
        documentStatus: { type: string, nullable: true }
        processingStatus: { type: string, nullable: true }
        requirements: { type: array, items: { type: string } }
        scopeOfWork: { type: array, items: { type: string } }
        techStack: { type: array, items: { type: string } }
        summary: { type: string, nullable: true }
        fiscalBudget: { $ref: "#/components/schemas/TorFiscalBudget" }
        anomalies:
          type: array
          items:
            $ref: "#/components/schemas/TorApiAnomaly"
        version:
          type: object
          required: [number, isLatest, supersededBy]
          properties:
            number: { type: integer, minimum: 1 }
            isLatest: { type: boolean }
            supersededBy: { type: string, nullable: true }

    TorApiEvidence:
      type: object
      required: [value]
      properties:
        value: { type: string }
        page: { type: integer, minimum: 1 }

    TorApiSummary:
      type: object
      required: [id, documentStatus, processingStatus, summary, requirements, scopeOfWork, techStack, evidence]
      properties:
        id: { type: string }
        documentStatus: { type: string, nullable: true }
        processingStatus: { type: string, nullable: true }
        summary: { type: string, nullable: true }
        fiscalBudget: { $ref: "#/components/schemas/TorFiscalBudget" }
        requirements: { type: array, items: { type: string } }
        scopeOfWork: { type: array, items: { type: string } }
        techStack: { type: array, items: { type: string } }
        evidence:
          type: object
          required: [requirements, scopeOfWork, techStack]
          properties:
            requirements: { type: array, items: { $ref: "#/components/schemas/TorApiEvidence" } }
            scopeOfWork: { type: array, items: { $ref: "#/components/schemas/TorApiEvidence" } }
            techStack: { type: array, items: { $ref: "#/components/schemas/TorApiEvidence" } }

    TorApiAnomalyReport:
      type: object
      required: [id, highBudgetFlag, budgetDeviationMultiplier, anomalies]
      properties:
        id: { type: string }
        highBudgetFlag: { type: boolean }
        budgetDeviationMultiplier: { type: number }
        anomalies:
          type: array
          items:
            $ref: "#/components/schemas/TorApiAnomaly"

    TorSummary:
      type: object
      description: "[Planned, FR-2.1]"
      properties:
        torId:
          type: string
        executiveSummary:
          type: string
        vendorEligibility:
          type: string
        requiredTeamExperience:
          type: string
        requiredTechStack:
          type: array
          items:
            type: string
        requiredCertifications:
          type: array
          items:
            type: string
        generatedAt:
          type: string
          format: date-time

    IngestionRun:
      type: object
      required: [id, source, startedAt, status, itemsFound, itemsNew, itemsFailed]
      properties:
        id:
          type: string
        source:
          type: string
          description: e.g. "BMA Procurement Portal", "e-GP".
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum: [running, success, failed]
        itemsFound:
          type: integer
        itemsNew:
          type: integer
        itemsFailed:
          type: integer

    ClassificationKeyword:
      type: object
      required: [id, keyword, category, updatedAt]
      properties:
        id:
          type: string
        keyword:
          type: string
        category:
          $ref: "#/components/schemas/KeywordCategory"
        updatedBy:
          type: string
          nullable: true
        updatedAt:
          type: string
          format: date-time

    User:
      type: object
      description: "[Planned]"
      required: [id, email, role]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
          nullable: true
        role:
          type: string
          enum: [contractor, admin]

    ContractorProfileInput:
      type: object
      description: "[Planned] FR-2.2.2 - self-reported, no verification required."
      properties:
        companyName:
          type: string
        techStack:
          type: array
          items:
            type: string
        projectCapacity:
          type: string
          description: Free-text self-reported capacity (e.g. team size, concurrent-project count).
        pastProjectValues:
          type: array
          items:
            type: number
          description: THB values of past completed projects, self-reported.
        certifications:
          type: array
          items:
            type: string
        capital:
          type: number
          nullable: true
        matchThreshold:
          type: number
          minimum: 0
          maximum: 100
          default: 70
          description: FR-2.3.3 - notification fires when a TOR's matchScore meets/exceeds this.

    ContractorProfile:
      allOf:
        - $ref: "#/components/schemas/ContractorProfileInput"
        - type: object
          required: [id, userId, createdAt, updatedAt]
          properties:
            id:
              type: string
            userId:
              type: string
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time

    MatchResult:
      type: object
      description: "[Planned, FR-2.3.2]"
      required: [torId, matchScore, computedAt]
      properties:
        torId:
          type: string
        matchScore:
          type: number
          minimum: 0
          maximum: 100
        skillOverlapScore:
          type: number
          nullable: true
        contractSizeScore:
          type: number
          nullable: true
        teamCapacityScore:
          type: number
          nullable: true
        computedAt:
          type: string
          format: date-time

    BudgetAnomalyTag:
      type: string
      enum: [NONE, HIGH_BUDGET_ANOMALY]

    BudgetAnomaly:
      type: object
      description: "[Planned, FR-3.1]"
      properties:
        baselinePrice:
          type: number
          description: Category Average(Scope Category), or the TOR's own budget if no historical category data exists yet.
        deviationMultiplier:
          type: number
          description: TOR Budget / Baseline Price.
        tag:
          $ref: "#/components/schemas/BudgetAnomalyTag"

    FlaggedClause:
      type: object
      description: "[Planned, FR-3.2]"
      required: [clauseText, type, reasoning]
      properties:
        clauseText:
          type: string
        type:
          type: string
          enum: [IRRELEVANT_HARDWARE, UNREALISTIC_TENURE, VENDOR_LOCK_IN, OTHER]
        reasoning:
          type: string
          description: Stored LLM/rule-based reasoning behind the flag (FR-3.2.3).

    AnomalyReport:
      type: object
      description: "[Planned]"
      properties:
        torId:
          type: string
        budgetAnomaly:
          $ref: "#/components/schemas/BudgetAnomaly"
        flaggedClauses:
          type: array
          items:
            $ref: "#/components/schemas/FlaggedClause"

    AnalyticsAggregates:
      type: object
      description: "[FR-4.1.3] Spend metrics over every matching project."
      required: [projectCount, totalSpend, meanBudget, medianDuration, softwareCount, summarizedCount, anomalyCount, byAgency, byStatus, topTechnologies]
      properties:
        projectCount: { type: integer }
        totalSpend: { type: number, description: Sum of budgets in THB. }
        meanBudget: { type: number, description: Mean budget in THB of projects with a budget. }
        medianDuration: { type: number, nullable: true, description: Approximate median contract duration in days. }
        softwareCount: { type: integer }
        summarizedCount: { type: integer, description: Projects with an AI summary of their TOR. }
        anomalyCount: { type: integer, description: Projects with a high budget or flagged clauses. }
        byAgency:
          type: array
          description: Agencies ordered by total spend, highest first (top 20).
          items:
            type: object
            required: [agency, projectCount, totalSpend, meanBudget]
            properties:
              agency: { type: string, nullable: true }
              projectCount: { type: integer }
              totalSpend: { type: number }
              meanBudget: { type: number }
        byStatus:
          type: array
          items:
            type: object
            required: [status, projectCount]
            properties:
              status: { type: string }
              projectCount: { type: integer }
        topTechnologies:
          type: array
          items:
            type: object
            required: [technology, projectCount]
            properties:
              technology: { type: string }
              projectCount: { type: integer }

    AnalyticsExportRow:
      type: object
      required: [id, title, agency, subAgency, budget, projectStatus, isSoftware, announceDate, contractStart, contractEnd, durationDays, highBudgetFlag, budgetDeviationMultiplier, updatedAt]
      properties:
        id: { type: string }
        title: { type: string, nullable: true }
        agency: { type: string, nullable: true }
        subAgency: { type: string, nullable: true }
        budget: { type: number, nullable: true }
        projectStatus: { type: string }
        isSoftware: { type: boolean, nullable: true }
        announceDate: { type: string, format: date-time, nullable: true }
        contractStart: { type: string, format: date-time, nullable: true }
        contractEnd: { type: string, format: date-time, nullable: true }
        durationDays: { type: number, nullable: true }
        highBudgetFlag: { type: boolean }
        budgetDeviationMultiplier: { type: number }
        updatedAt: { type: string, format: date-time, nullable: true }

    AnalyticsSearchResponse:
      type: object
      required: [status, generatedAt, filters, dataQuality, metrics, charts, facets, page, limit, total, data]
      properties:
        status: { type: string, enum: [success] }
        generatedAt: { type: string, format: date-time }
        filters: { type: object, description: The validated filter values applied to this response. }
        dataQuality:
          type: object
          description: Identifies temporary field derivations until canonical bidding data exists.
          additionalProperties: { type: string }
        metrics:
          type: object
          required: [totalTors, totalBudget, openForBidding, openBudget, closingSoon]
          properties:
            totalTors: { type: integer, minimum: 0 }
            totalBudget: { type: number, minimum: 0 }
            openForBidding: { type: integer, minimum: 0 }
            openBudget: { type: number, minimum: 0 }
            closingSoon: { type: integer, minimum: 0 }
        charts:
          type: object
          required: [fiscalYearTrend, projectLength, biddingStatus, closingWindow, documentReadiness, topAgencies]
          properties:
            fiscalYearTrend:
              type: array
              items:
                type: object
                required: [fiscalYear, count, totalBudget]
                properties:
                  fiscalYear: { type: integer }
                  count: { type: integer, minimum: 0 }
                  totalBudget: { type: number, minimum: 0 }
            projectLength:
              type: array
              items:
                type: object
                required: [key, label, count, totalBudget]
                properties:
                  key: { type: string, enum: [one, two, threePlus, unknown] }
                  label: { type: string }
                  count: { type: integer, minimum: 0 }
                  totalBudget: { type: number, minimum: 0 }
            biddingStatus:
              type: array
              items: { $ref: "#/components/schemas/AnalyticsBreakdown" }
            closingWindow:
              type: array
              items: { $ref: "#/components/schemas/AnalyticsBreakdown" }
            documentReadiness:
              type: array
              items: { $ref: "#/components/schemas/AnalyticsBreakdown" }
            topAgencies:
              type: array
              items:
                type: object
                required: [name, count, totalBudget]
                properties:
                  name: { type: string }
                  count: { type: integer, minimum: 0 }
                  totalBudget: { type: number, minimum: 0 }
        facets:
          type: object
          required: [agencies, fiscalYears]
          properties:
            agencies:
              type: array
              items:
                type: object
                required: [name, count]
                properties:
                  name: { type: string }
                  count: { type: integer, minimum: 0 }
            fiscalYears:
              type: array
              items:
                type: object
                required: [year, count]
                properties:
                  year: { type: integer }
                  count: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        limit: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }
        data:
          type: array
          items: { $ref: "#/components/schemas/AnalyticsTorItem" }

    AnalyticsBreakdown:
      type: object
      required: [key, count, totalBudget]
      properties:
        key: { type: string }
        count: { type: integer, minimum: 0 }
        totalBudget: { type: number, minimum: 0 }

    AnalyticsTorItem:
      type: object
      required: [id, title, budget, projectStatus, isSoftware, announceDate, bidClosesAt, bidStartsAt, bidSubmissionDate, bidStartTime, bidEndTime, fiscalYear, fiscalYearSource, biddingStatus, documentReadiness, projectLength]
      properties:
        id: { type: string }
        title: { type: string }
        agency: { type: string }
        budget: { type: number, minimum: 0, nullable: true }
        projectStatus: { type: string }
        isSoftware: { type: boolean, nullable: true }
        announceDate: { type: string, format: date-time, nullable: true }
        contractStart: { type: string, format: date-time, nullable: true }
        contractEnd: { type: string, format: date-time, nullable: true }
        fiscalYear: { type: integer, nullable: true }
        biddingStatus: { type: string, enum: [open, closed, cancelled, unknown] }
        fiscalYearSource: { type: string, enum: [document, ambiguous, bid_close_estimate, unknown] }
        bidClosesAt: { type: string, format: date-time, nullable: true }
        bidStartsAt: { type: string, format: date-time, nullable: true }
        bidSubmissionDate: { type: string, format: date, nullable: true }
        bidStartTime: { type: string, nullable: true }
        bidEndTime: { type: string, nullable: true }
        documentReadiness: { type: string, enum: [analysis_ready, tor_ready, announcement_only, no_documents] }
        projectLength: { type: integer, nullable: true, minimum: 1 }

    PaginatedList:
      type: object
      required: [total, page, pageSize]
      properties:
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: "TOR_NOT_FOUND"
            message:
              type: string
              example: "No TOR exists with the given id."

