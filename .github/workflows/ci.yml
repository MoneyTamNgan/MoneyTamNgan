name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

env:
  # Dummy values: no live database/OAuth provider is reachable in CI (and shouldn't
  # need to be — the build and test suites never open a real network connection).
  MONGODB_URI: mongodb://localhost:27017/ci
  JWT_SECRET: ci-placeholder-secret
  NEXT_PUBLIC_REDIRECT_URI: http://localhost:3000/api/auth/google/callback

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  test:
    name: Test (mocked data)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:vitest

  contract:
    name: API contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint OpenAPI spec
        run: npx @redocly/cli lint docs/api/openapi.yaml
      - name: Validate API responses against the spec
        run: npx vitest run tests/contract

  # After every green push to develop: open (or reuse) the develop -> main PR,
  # approve it as github-actions[bot] to satisfy main's 1-review rule, and turn
  # on auto-merge so it lands once main's required checks pass on it. Lives in
  # this workflow (not a separate `workflow_run` one) because `workflow_run`
  # only fires for workflow files on the default branch (main).
  promote:
    name: Promote develop to main
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: [build, test, contract]
    runs-on: ubuntu-latest
    concurrency:
      group: promote-to-main
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whether main is behind develop
        id: diff
        run: |
          git fetch origin main develop
          echo "ahead=$(git rev-list --count origin/main..origin/develop)" >> "$GITHUB_OUTPUT"

      # Opened with a PAT, not GITHUB_TOKEN: PRs opened by GITHUB_TOKEN don't
      # trigger workflows, so main's required checks would never run on it.
      - name: Create the promotion PR if one isn't open yet
        if: steps.diff.outputs.ahead != '0'
        id: pr
        env:
          GH_TOKEN: ${{ secrets.PROMOTE_TO_MAIN_TOKEN }}
        run: |
          number=$(gh pr list --base main --head develop --state open --json number --jq '.[0].number // empty')
          if [ -z "$number" ]; then
            url=$(gh pr create --base main --head develop \
              --title "chore: promote develop to main" \
              --body "Automated promotion: CI passed on develop, opening this PR to bring main up to date.")
            number=${url##*/}
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"

      # Approved by a different identity than the PR author (the PAT owner),
      # since GitHub doesn't let authors approve their own PRs.
      - name: Approve as github-actions[bot]
        if: steps.diff.outputs.ahead != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr review "${{ steps.pr.outputs.number }}" --approve --body "CI passed on develop."

      - name: Enable auto-merge (merge commit)
        if: steps.diff.outputs.ahead != '0'
        env:
          GH_TOKEN: ${{ secrets.PROMOTE_TO_MAIN_TOKEN }}
        run: gh pr merge "${{ steps.pr.outputs.number }}" --merge --auto
